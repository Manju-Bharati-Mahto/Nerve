server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/nerve/releases/current;
    index index.html;

    # Upload limits: without them nginx refuses any body over 1 MB with an HTML
    # 413 and the app shows "Upload failed." (BrandOps photos are 10 x 10 MB, the
    # outreach video fallback upload is up to 2 GB). First-install copy only —
    # on a live host deploy/scripts/set-upload-limits.sh patches these values
    # (and the CSP connect-src for direct uploads to Google Drive) in place, and
    # deploy.sh re-runs it on every deploy.
    location /api/ {
        client_max_body_size    2100m;
        client_body_timeout     300s;
        proxy_request_buffering on;
        proxy_send_timeout      300s;
        proxy_read_timeout      900s;
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ── Public external portals (casting registration, media request intake) ──
    # These are standalone pages served by the API container, NOT part of the
    # React SPA bundle — an external requester must never be handed the internal
    # dashboard. Without these blocks the paths fall through to the SPA fallback
    # below, React Router matches nothing and renders its own 404, which is
    # exactly the "Oops! Page not found" reported against the generated links.
    location /casting/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /request/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
