/* FR-1.6 — Production velocity */
function velocityWidget(){
  const rangeKey=S.filters.dashRange||'3M';
  const weeks=rangeKey==='1M'?5:rangeKey==='3M'?12:26;
  const users=scopeUsers();
  const which=S.filters.dashChart||'deliverables';
  const data=[];
  for(let i=weeks-1;i>=0;i--){
    const end=D.add(TODAY,-i*7), start=D.add(end,-6);
    const rs=DB.daily_reports.filter(r=>r.report_date>=start&&r.report_date<=end&&users.includes(r.user_id)&&r.status!=='draft');
    const ids=rs.map(r=>r.id);
    const v = which==='deliverables'
      ? DB.deliverables.filter(x=>x.completed_at&&x.completed_at>=start&&x.completed_at<=end).length*4+rint(2,6)
      : which==='hours'
      ? +(DB.report_tasks.filter(t=>ids.includes(t.daily_report_id)).reduce((a,t)=>a+t.minutes,0)/60).toFixed(0)
      : rs.length;
    data.push({l:D.fmt(start),s:D.fmt(start).replace(/ \d\d$/,''),l2:'Week '+(weeks-i),v});
  }
  const tot=data.reduce((a,d)=>a+d.v,0), avg=(tot/data.length).toFixed(1);
  const half=Math.floor(data.length/2);
  const growth=(()=>{const a=data.slice(0,half).reduce((x,d)=>x+d.v,0)/half,
    b=data.slice(half).reduce((x,d)=>x+d.v,0)/(data.length-half);
    return a?Math.round((b-a)/a*100):0;})();
  const titles={deliverables:'Deliverables completed per week',hours:'Hours logged per week',reports:'Reports submitted per week'};
  return `<div class="card">
    <div class="card-head"><h3>Production Velocity<span class="sub">${titles[which]}</span></h3>
      <div class="ca">
        <div class="btn-group hide-sm">
          <button data-act="dashChart" data-v="deliverables" class="${which==='deliverables'?'on':''}">Output</button>
          <button data-act="dashChart" data-v="hours" class="${which==='hours'?'on':''}">Hours</button>
          <button data-act="dashChart" data-v="reports" class="${which==='reports'?'on':''}">Reports</button>
        </div>
        <button class="btn sm" data-menu="velRange">Last ${rangeKey==='1M'?'month':rangeKey==='3M'?'3 months':'6 months'} ${ic('down')}</button>
      </div></div>
    <div class="card-body pad" style="padding-top:4px">
      ${chartLine([{c:'var(--brand-500)',data}],{area:true,h:250,pb:36})}
      <div class="f gap4 wrap mt3" style="padding-top:14px;border-top:1px solid var(--border)">
        <span class="small mut">Total <b class="mut" style="color:var(--text)">${tot}</b></span>
        <span class="small mut">Weekly average <b style="color:var(--text)">${avg}</b></span>
        <span class="small mut">Peak <b style="color:var(--text)">${Math.max(...data.map(d=>d.v))}</b></span>
        <span class="small mut ml-auto">Trend
          <span class="delta ${growth>=0?'up':'dn'}">${growth>=0?'▲':'▼'} ${Math.abs(growth)}%</span> vs first half</span>
      </div>
    </div>
    ${reqid('FR-1.6','Productivity charts — 1W/1M/6M/custom ranges')?'':''}
    <div class="card-foot">${reqid('FR-1.6','Retained from the existing Nerve submissions chart, extended with hours and deliverable throughput')}
      Deliverable state is the objective signal — task percentages are not (D3).</div>
  </div>`;
}

function auditTarget(a){
  switch(a.entity_type){
    case 'project':return proj(a.entity_id).name;
    case 'deliverable':return (deliv(a.entity_id)||{title:'deliverable'}).title;
    case 'deliverable_version':{const v=DB.deliverable_versions.find(v=>v.id===a.entity_id);
      return v?(deliv(v.deliverable_id)||{title:''}).title+' v'+v.version_no:'a version';}
    case 'daily_report':{const r=DB.daily_reports.find(r=>r.id===a.entity_id);
      return r?'daily report — '+D.fmt(r.report_date):'a report';}
    case 'equipment_item':return (equip(a.entity_id).make||'')+' '+(equip(a.entity_id).model||'');
    case 'user':return user(a.entity_id).full_name;
    case 'automation_rule':{const r=DB.automation_rules.find(r=>r.id===a.entity_id);return r?r.rule_key:'a rule';}
    case 'import_batch':return 'the Excel master sheet';
    case 'analytics':return 'the department monthly pack';
    case 'leave_request':{const l=DB.leave_requests.find(l=>l.id===a.entity_id);return l?'leave for '+user(l.user_id).full_name.split(' ')[0]:'leave';}
    case 'deliverable_type':return dtype(a.entity_id).name;
    case 'shoot':{const sh=DB.shoots.find(x=>x.id===a.entity_id);return sh?sh.title:'a shoot';}
    case 'card':{const c=DB.cards.find(x=>x.id===a.entity_id);return c?c.title:'a card';}
    default:return a.entity_type.replace(/_/g,' ');
  }
}

      <div class="ca"><span class="chip">${myProjects.length}</span></div></div>
      <div class="card-body flush">${myProjects.length?myProjects.slice(0,6).map(p=>`
        <button class="list-row" data-go="#/media/projects/${p.id}">
          <span style="font-size:15px;color:${ptype(p.project_type_id).color}">${ptype(p.project_type_id).icon}</span>
          <span class="lr-main"><b>${esc(p.name)}</b><span><span class="code">${p.code}</span> · ${esc(ptype(p.project_type_id).name)}</span></span>
          ${statusPill(PROJ_STATUS,p.status)}
        </button>`).join(''):`<div class="empty" style="padding:20px"><p>No projects assigned to you yet.</p></div>`}
      </div></div>

    <div class="card mb4">
      <div class="card-head"><h3>Today’s task log</h3>
        <div class="ca"><span class="chip">${tasks.length} · ${mins2h(tasks.reduce((s,t)=>s+t.minutes,0))}</span></div></div>
      <div class="card-body flush">
        ${tasks.length?tasks.map(t=>`<div class="list-row" data-act="editTask" data-tid="${t.id}">
          <span style="font-size:15px">${tcat(t.task_category_id).icon}</span>
          <span class="lr-main"><b>${esc(t.description)}</b>
            <span>${t.start_time}–${t.end_time} · ${esc(proj(t.project_id).name)}${t.quantity?' · '+t.quantity+' '+esc(t.unit||''):''}</span></span>
          ${t.status==='blocked'?'<span class="status st-danger"><span class="si">‖</span>Blocked</span>':
            t.status==='in_progress'?'<span class="status st-info"><span class="si">▶</span>WIP</span>':
            '<span class="status st-success"><span class="si">✔</span>Done</span>'}
        </div>`).join(''):`<div class="empty" style="padding:20px"><div class="e-ico">✎</div>
          <p>Nothing logged yet. Log as you go — end-of-day recall produces fiction (D1).</p></div>`}
      </div>
      <div class="card-foot"><button class="btn sm primary block" data-act="logTask">＋ Log task <span class="mut" style="opacity:.7">≤ 60s</span></button></div>
    </div>

    ${expects?`<div class="card mb4" style="border-color:var(--brand-300)">
      <div class="card-body">
        <div class="between mb3"><b>Submit today’s report</b><span class="chip">${tasks.length} tasks · ${mins2h(tasks.reduce((s,t)=>s+t.minutes,0))}</span></div>
        <div class="small mut mb3">One report per person per day (FR-2.1). Submitting is a review-and-confirm of what you already logged — not a re-typing exercise.</div>
        <button class="btn primary block ${!tasks.length||(r&&['submitted','approved','flagged'].includes(r.status))?'disabled':''}"
          data-act="submitReport">${r&&['submitted','approved','flagged','auto_approved'].includes(r.status)?'Already submitted ✔':'Review & submit'}</button>
      </div></div>`:`<div class="note warn mb4"><b>No report expected today.</b> You have approved leave — reminders are suppressed and the day is excluded from consistency metrics (FR-2.11 / BR-3).</div>`}

    <div class="card mb4"><div class="card-head"><h3>My deliverables</h3></div>
      <div class="card-body flush">${myDue.length?myDue.slice(0,6).map(d=>{
        const over=d.due_date<TODAY;
        return `<button class="list-row" data-drawer="deliverable:${d.id}">
          <span style="font-size:15px">${dtype(d.deliverable_type_id).icon}</span>
          <span class="lr-main"><b>${esc(d.title)}</b><span>${esc(proj(d.project_id).name)}</span></span>
          <span class="${over?'status st-danger':'chip'}">${over?'<span class="si">⚑</span>':''}${D.fmt(d.due_date)}</span>
        </button>`;}).join(''):`<div class="empty" style="padding:20px"><p>Nothing open.</p></div>`}
      </div></div>

    <div class="card"><div class="card-head"><h3>Equipment I hold</h3></div>
      <div class="card-body flush">${held.length?held.map(e=>{const h=eqHolder(e.id);
        const over=h.expected_return_at&&h.expected_return_at<TODAY;
        return `<button class="list-row" data-go="#/media/equipment/${e.asset_tag}">
          <span style="font-size:15px">${ecat(e.category_id).icon}</span>
          <span class="lr-main"><b>${esc(e.make+' '+e.model)}</b><span class="code">${e.asset_tag}</span></span>
          <span class="${over?'status st-danger':'chip'}">${over?'Overdue '+D.diff(TODAY,h.expected_return_at)+'d':'Due '+D.fmt(h.expected_return_at)}</span>
        </button>`;}).join(''):`<div class="empty" style="padding:20px"><p>Nothing checked out to you.</p></div>`}
      </div></div>`;

  return `<div class="page-head">
      <div><div class="crumb">§9.3 Mobile strategy · wireframe W2</div>
      <h1 class="page-title">My Day</h1>
      <div class="page-sub">Your single screen for the day — today’s shoot, the running task log, one-tap
        report submit, open deliverables and the gear you hold. Log as you go (D1); submitting is a
        review-and-confirm, not a re-type.</div></div>
      <div class="page-actions"><button class="btn" data-act="logTask">＋ Log task</button>
        <button class="btn primary" data-act="submitReport">Submit report</button></div>
    </div>
    <div class="myday-cols">${content}</div>
    <style>
      /* My Day fills the page: two balanced columns on wide screens, single on narrow.
         columns keep the card stack readable instead of one full-width column. */
      .myday-cols{column-gap:20px}
      @media(min-width:1100px){.myday-cols{column-count:2}}
      @media(min-width:1600px){.myday-cols{column-count:3}}
      .myday-cols>*{break-inside:avoid}
      .myday-cols>.between{column-span:all;break-after:avoid}
    </style>`;
}
/* ==========================================================================
   MODULE 2 — DAILY REPORTING (§7.2). D1: log-as-you-go. D2: exception-based
   review. D3: task % is a secondary signal only.
   ========================================================================== */
function viewReports(date){
  if(date)S.reportDate=date;
  const tab=S.tab.reports||(isEmp()?'mine':'queue');
  const tabs=[
    ['mine','My reports',DB.daily_reports.filter(r=>r.user_id===S.me).length],
    ...(!isEmp()?[['queue','Review queue',visibleReports().filter(r=>['flagged','returned'].includes(r.status)).length],
                  ['team','Team calendar',myTeamIds().length],
                  ['compliance','Compliance',0]]:[])
  ];
  return `<div class="page-head">
      <div><div class="crumb">Module 2 · §7.2</div><h1 class="page-title">Daily Reports</h1>
      <div class="page-sub">The primitive is the <b>task log</b>, created during the day. The daily report is a container
      auto-assembled from that day’s logs — “submitting” is a 30-second review-and-confirm ${reqid('D1','Log-as-you-go replaces end-of-day recall')}.
      Reports auto-approve after 48h unless flagged ${reqid('D2','Exception-based review')}.</div></div>
      <div class="page-actions">
        <button class="btn" data-act="logTask">＋ Log task <span class="kbd">L</span></button>
        <button class="btn primary" data-act="submitReport">Submit today’s report</button>
      </div></div>
    <div class="tabs">${tabs.map(([k,l,c])=>`<button data-tab="${k}" data-tabkey="reports" class="${tab===k?'on':''}">${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}</div>
    ${tab==='mine'?reportsMine():tab==='queue'?reportsQueue():tab==='team'?reportsTeam():reportsCompliance()}`;
}

function reportsMine(){
  const rs=DB.daily_reports.filter(r=>r.user_id===S.me).sort((a,b)=>a.report_date<b.report_date?1:-1);
  const today=rs.find(r=>r.report_date===TODAY);
  return `<div class="grid g21">
    <div>
      ${today?reportCard(today,true):`<div class="card mb4"><div class="card-body">
        <div class="empty"><div class="e-ico">✎</div><h4>No tasks logged today</h4>
        <p>Log the task while you are doing it. The report assembles itself.</p>
        <button class="btn primary" data-act="logTask">＋ Log your first task</button></div></div></div>`}
      <div class="card"><div class="card-head"><h3>Report history</h3>${reqid('FR-2.7','Backfill until 23:59 next day; older requires TL unlock')}</div>
        <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Date</th><th>Tasks</th><th>Hours</th><th>Projects</th><th>Status</th><th></th></tr></thead>
          <tbody>${rs.slice(0,30).map(r=>{
            const ts=DB.report_tasks.filter(t=>t.daily_report_id===r.id);
            const pjs=[...new Set(ts.map(t=>t.project_id))];
            const editable=D.diff(TODAY,r.report_date)<=1;
            return `<tr class="click" data-drawer="report:${r.id}">
              <td><div class="t-main">${D.fmt(r.report_date)}</div><div class="t-sub">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][D.dow(r.report_date)]}${r.late?' · <span style="color:var(--warn)">late</span>':''}</div></td>
              <td>${ts.length}</td><td>${mins2h(r.total_minutes)}</td>
              <td class="hide-sm">${pjs.slice(0,2).map(p=>`<span class="tag">${esc(proj(p).name.slice(0,22))}</span>`).join(' ')}${pjs.length>2?` +${pjs.length-2}`:''}</td>
              <td>${statusPill(REPORT_STATUS,r.auto_approved?'auto_approved':r.status)}</td>
              <td class="num">${editable?'<span class="chip">editable</span>':'<span class="chip" title="BR-9: after approval, edits require TL unlock">🔒 locked</span>'}</td>
            </tr>`;}).join('')}</tbody></table></div></div></div>
    </div>
    <div class="fc gap4">
      <div class="card"><div class="card-head"><h3>My compliance</h3>${reqid('FR-8.1','Reporting consistency = submitted-on-time ÷ working days expected')}</div>
        <div class="card-body">
          <div class="f ac gap4 mb4"><div class="ring-wrap"><div class="ring" style="--p:${consistency(S.me)}"></div>
            <div class="ring-txt"><b>${consistency(S.me)}%</b><span>30-day</span></div></div>
            <div class="fc gap2" style="flex:1">
              <div class="between"><span class="small mut">Hours (30d)</span><b>${userHours(S.me,D.add(TODAY,-30),TODAY).toFixed(0)}h</b></div>
              <div class="between"><span class="small mut">Reports (30d)</span><b>${DB.daily_reports.filter(r=>r.user_id===S.me&&r.report_date>=D.add(TODAY,-30)).length}</b></div>
              <div class="between"><span class="small mut">Late submissions</span><b>${DB.daily_reports.filter(r=>r.user_id===S.me&&r.late).length}</b></div>
              <div class="between"><span class="small mut">Flagged (all time)</span><b>${DB.daily_reports.filter(r=>r.user_id===S.me&&r.flag_rules.length).length}</b></div>
            </div></div>
          <div class="note"><b>Holidays and approved leave are excluded</b> from the denominator (FR-2.11) — you are never penalised for a day the system did not expect a report.</div>
        </div></div>
      <div class="card"><div class="card-head"><h3>Offline queue</h3>${reqid('NFR-7','PWA: task logs queue locally and sync')}</div>
        <div class="card-body">
          <div class="between mb3"><span class="small">Connection</span><span class="status st-success"><span class="si">●</span>Online</span></div>
          <div class="between mb3"><span class="small">Queued locally</span><b>0 tasks</b></div>
          <div class="small mut3">Tours are a core scenario, not an edge case. Conflicts resolve last-write-wins with an audit entry (FR-2.10).</div>
          <button class="btn sm block mt3" data-act="simulateOffline">Simulate airplane mode</button>
        </div></div>
    </div></div>`;
}

function reportCard(r,editable){
  const ts=DB.report_tasks.filter(t=>t.daily_report_id===r.id).sort((a,b)=>a.start_time<b.start_time?-1:1);
  const byProject={};ts.forEach(t=>byProject[t.project_id]=(byProject[t.project_id]||0)+t.minutes);
  const autoAt = r.submitted_at? new Date(new Date(r.submitted_at).getTime()+48*3600e3) : null;
  return `<div class="card mb4">
    <div class="card-head"><h3>${D.fmtLong(r.report_date)}</h3>
      ${statusPill(REPORT_STATUS,r.auto_approved?'auto_approved':r.status)}
      <div class="ca"><span class="chip">${ts.length} tasks</span><span class="chip">${mins2h(r.total_minutes)}</span>
      ${editable?`<button class="btn xs" data-act="logTask">＋ Task</button>`:''}</div></div>
    <div class="card-body">
      ${r.status==='flagged'?`<div class="note danger mb4"><b>Flagged for review (AUTO-13).</b> ${esc(r.flagged_reason)}<br>
        <span class="small">Auto-approval is blocked until a Team Lead acts (BR-4).</span></div>`:''}
      ${r.status==='returned'?`<div class="note warn mb4"><b>Returned for edit.</b> ${esc(r.review_comment||'See the reviewer’s comment.')} Reopen, fix and resubmit (FR-2.6).</div>`:''}
      ${r.status==='submitted'&&autoAt?`<div class="note info mb4"><b>Auto-approves ${autoAt.toISOString().slice(0,10)} at ${autoAt.toISOString().slice(11,16)}</b>
        — 48h after submission unless flagged (D2 / BR-4). No one needs to rubber-stamp it.</div>`:''}
      ${ts.length?`<div class="day-tl">${ts.map(t=>`
        <div class="day-slot"><div class="day-time">${t.start_time}<br><span class="mut3">${t.end_time}</span></div>
          <div class="day-block ${t.status==='blocked'?'blocked':t.status==='in_progress'?'progress':''}">
            <div class="between"><b class="small">${esc(t.description)}</b>
              <span class="f gap2 ac">${t.quantity?`<span class="chip">${t.quantity} ${esc(t.unit||'')}</span>`:''}
                <span class="chip">${mins2h(t.minutes)}</span>
                ${editable?`<button class="btn xs ghost" data-act="editTask" data-tid="${t.id}">✎</button>`:''}</span></div>
            <div class="small mut mt1">${tcat(t.task_category_id).icon} ${esc(tcat(t.task_category_id).name)} ·
              <a href="#/media/projects/${t.project_id}">${esc(proj(t.project_id).name)}</a>
              ${t.deliverable_id?` · <span class="chip">◆ ${esc((deliv(t.deliverable_id)||{title:''}).title.slice(0,34))}</span>`:''}</div>
            ${t.progress_before!=null?`<div class="f ac gap2 mt2 small mut3">Progress ${t.progress_before}% → ${t.progress_after}%
              ${bar(t.progress_after,'info')} <span class="xsmall">secondary signal only (D3)</span></div>`:''}
            ${t.blocker_note?`<div class="small mt2" style="color:var(--danger)">‖ ${esc(t.blocker_note)}</div>`:''}
            ${t.evidence&&t.evidence.length?`<div class="mt2">${t.evidence.map(e=>`<a class="chip" href="${esc(e)}" target="_blank" rel="noopener">⛁ Evidence</a>`).join(' ')}</div>`:''}
          </div></div>`).join('')}</div>`:
        `<div class="empty" style="padding:26px"><p>No tasks on this report.</p></div>`}
      ${Object.keys(byProject).length?`<div class="divider"></div>
        <div class="small b mb2">Per-project subtotals</div>
        <div class="f wrap gap2">${Object.entries(byProject).map(([p,m])=>
          `<span class="chip"><span class="dot" style="background:${ptype(proj(+p).project_type_id).color}"></span>${esc(proj(+p).name)} · ${mins2h(m)}</span>`).join('')}</div>`:''}
      ${r.note?`<div class="note mt4"><b>Note:</b> ${esc(r.note)}</div>`:''}
    </div>
    ${editable&&r.status==='draft'?`<div class="card-foot">
      <button class="btn primary sm" data-act="submitReport">Review &amp; submit</button>
      <span class="small mut3">Total ${mins2h(r.total_minutes)} · ${ts.length} tasks</span></div>`:''}
  </div>`;
}

function reportsQueue(){
  const q=visibleReports().filter(r=>['flagged','submitted','returned'].includes(r.status))
    .map(r=>({r,age:D.diff(TODAY,r.report_date)})).sort((a,b)=>b.age-a.age);
  const flagged=q.filter(x=>x.r.status==='flagged');
  const rule=DB.automation_rules.find(r=>r.rule_key==='AUTO-13');
  return `<div class="note mb4"><b>Exception-based review (D2).</b> At 18 people, approving every report is 90+ rubber-stamps a week;
    at 50 it collapses. Reports auto-approve at +48h unless a rule flags them, a lead flags them, or they land in the
    ${rule.config.random_sample_pct}% random sample. You review anomalies — the full audit trail is kept either way.</div>
  <div class="grid g4 sec">
    <div class="stat"><span class="stat-label">Flagged — need you</span><span class="stat-val">${flagged.length}</span>
      <span class="stat-meta">oldest ${flagged.length?flagged[0].age:0}d</span></div>
    <div class="stat"><span class="stat-label">Submitted, auto-approving</span><span class="stat-val">${q.filter(x=>x.r.status==='submitted').length}</span>
      <span class="stat-meta">no action required</span></div>
    <div class="stat"><span class="stat-label">Returned, awaiting resubmit</span><span class="stat-val">${q.filter(x=>x.r.status==='returned').length}</span>
      <span class="stat-meta">with the author</span></div>
    <div class="stat"><span class="stat-label">Review load saved</span><span class="stat-val">${Math.round((1-flagged.length/Math.max(1,q.length))*100)}%</span>
      <span class="stat-meta">vs approving everything</span></div>
  </div>
  <div class="card"><div class="card-head"><h3>Queue</h3>${reqid('FR-2.6','Flagged reports require explicit TL action: Approve / Comment &amp; Return')}
    <div class="ca"><button class="btn xs" data-act="bulkApprove">Approve all flagged</button></div></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Person</th><th>Date</th><th>Hours</th><th>Flag reason</th><th>Status</th><th class="num">Actions</th></tr></thead>
      <tbody>${q.length?q.map(({r,age})=>`<tr>
        <td><div class="f ac gap2">${avatarP(r.user_id,'sm')}<div><div class="t-main">${esc(user(r.user_id).designation)}</div>
          <div class="t-sub">${esc(capacityOf(r.user_id))}</div></div></div></td>
        <td>${D.fmt(r.report_date)} ${ageBadge(age)}</td>
        <td>${mins2h(r.total_minutes)}</td>
        <td class="small">${r.flagged_reason?esc(r.flagged_reason):'<span class="mut3">—</span>'}</td>
        <td>${statusPill(REPORT_STATUS,r.status)}</td>
        <td class="num nowrap">
          <button class="btn xs" data-drawer="report:${r.id}">Open</button>
          ${r.status==='flagged'?`<button class="btn xs primary" data-act="approveReport" data-rid="${r.id}">Approve</button>
          <button class="btn xs" data-act="returnReport" data-rid="${r.id}">Return</button>`:''}
        </td></tr>`).join(''):`<tr><td colspan="6" class="tbl-empty">Queue is empty — that is the design working.</td></tr>`}
      </tbody></table></div></div></div>`;
}

function reportsTeam(){
  const days=[];for(let i=13;i>=0;i--)days.push(D.add(TODAY,-i));
  const team=myTeamIds();
  return `<div class="card"><div class="card-head"><h3>Team submission grid — last 14 days</h3>
    ${reqid('FR-1.2','Gap list — who has not submitted')}</div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl dense">
      <thead><tr><th style="min-width:170px">Person</th>${days.map(d=>`<th class="num" title="${D.fmtLong(d)}">${D.parse(d).getDate()}</th>`).join('')}
        <th class="num">Consistency</th></tr></thead>
      <tbody>${team.map(id=>`<tr>
        <td><div class="f ac gap2">${avatarP(id,'sm')}<span class="t-main">${esc(user(id).designation)}</span></div></td>
        ${days.map(d=>{
          if(!expectsReport(id,d))return `<td class="num" title="No report expected — leave/holiday/Sunday"><span class="mut3">·</span></td>`;
          const r=DB.daily_reports.find(x=>x.user_id===id&&x.report_date===d);
          if(!r)return `<td class="num" title="Missing"><span style="color:var(--danger);font-weight:700">✕</span></td>`;
          if(r.status==='draft')return `<td class="num" title="Draft"><span style="color:var(--warn)">◔</span></td>`;
          if(r.status==='flagged')return `<td class="num" title="Flagged"><span style="color:var(--danger)">⚑</span></td>`;
          return `<td class="num" title="${REPORT_STATUS[r.status].l}${r.late?' (late)':''}"><span style="color:${r.late?'var(--warn)':'var(--success)'}">${r.late?'◑':'●'}</span></td>`;
        }).join('')}
        <td class="num b">${consistency(id,14)}%</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card-foot">● on time · ◑ late (accepted but permanently marked, BR-10) · ◔ draft · ⚑ flagged · ✕ missing · · not expected</div>
  </div>`;
}

function reportsCompliance(){
  const team=myTeamIds();
  const rows=team.map(id=>({id,c30:consistency(id,30),c14:consistency(id,14),
    late:DB.daily_reports.filter(r=>r.user_id===id&&r.late).length,
    flags:DB.daily_reports.filter(r=>r.user_id===id&&r.flag_rules.length).length,
    hrs:userHours(id,D.add(TODAY,-30),TODAY)})).sort((a,b)=>a.c30-b.c30);
  const median=[...rows.map(r=>r.hrs)].sort((a,b)=>a-b)[Math.floor(rows.length/2)]||0;
  return `<div class="grid g2 sec">
    <div class="card"><div class="card-head"><h3>Consistency — 30 days</h3></div>
      <div class="card-body">${chartBar(rows.map(r=>({l:user(r.id).full_name,s:user(r.id).full_name.split(' ')[0].slice(0,6),v:r.c30,
        c:r.c30<80?'var(--danger)':r.c30<92?'var(--warn)':'var(--brand-500)'})),{h:200,unit:'%'})}
        ${legend([{c:'var(--brand-500)',l:'≥ 92%'},{c:'var(--warn)',l:'80–91%'},{c:'var(--danger)',l:'< 80%'}])}</div></div>
    <div class="card"><div class="card-head"><h3>AUTO-9 — quiet check-in list</h3>${reqid('AUTO-9','Private prompt to TL only — never public shaming')}</div>
      <div class="card-body">
        <div class="note warn mb3"><b>Private to you.</b> These people logged under 50% of the team median for two consecutive weeks.
          The rule is framed as “check in”, not “explain yourself” — and it is never visible to peers.</div>
        ${rows.filter(r=>r.hrs<median*0.5).map(r=>`<div class="list-row" data-go="#/media/team/${r.id}">
          ${avatar(r.id,'sm')}<span class="lr-main"><b>${esc(user(r.id).designation)}</b>
          <span>${r.hrs.toFixed(0)}h vs team median ${median.toFixed(0)}h</span></span>
          <span class="btn xs">Open profile</span></div>`).join('')||
          `<div class="empty" style="padding:20px"><p>No one is below the threshold.</p></div>`}
      </div></div>
  </div>
  <div class="card"><div class="card-head"><h3>Per-person detail</h3></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">

function projectFilters(){
  const f=S.filters.proj||(S.filters.proj={q:'',type:[],status:[],faculty:[],priority:[],owner:[],year:3,mine:false});
  return f;
}
function filteredProjects(){
  const f=projectFilters();
  let ps=visibleProjects();
  if(f.year)ps=ps.filter(p=>p.academic_year_id===f.year);
  if(f.q){const q=f.q.toLowerCase();ps=ps.filter(p=>(p.name+' '+p.code+' '+p.description+' '+p.faculty_served).toLowerCase().includes(q));}
  if(f.type.length)ps=ps.filter(p=>f.type.includes(p.project_type_id));
  if(f.status.length)ps=ps.filter(p=>f.status.includes(p.status));
  if(f.faculty.length)ps=ps.filter(p=>f.faculty.includes(p.faculty_served));
  if(f.priority.length)ps=ps.filter(p=>f.priority.includes(p.priority));
  if(f.owner.length)ps=ps.filter(p=>f.owner.includes(p.owner_id));
  if(f.mine)ps=ps.filter(p=>isOnProject(p.id)||p.owner_id===S.me);
  return ps;
}

function projTimeline(ps){
  const list=ps.filter(p=>p.start_date&&p.end_date).sort((a,b)=>a.start_date<b.start_date?-1:1);
  const min='2026-06-01',max='2027-01-31';
  const span=D.diff(max,min);
  const months=[];let m=min;while(m<max){months.push(m);m=D.iso(new Date(D.parse(m).getFullYear(),D.parse(m).getMonth()+1,1));}
  const todayPct=D.diff(TODAY,min)/span*100;
  return `<div class="gantt"><div class="gantt-grid">
    <div class="gantt-head"><div class="gh-name">Project</div><div class="gh-months">
      ${months.map(mm=>`<div class="gh-m">${D.month(mm)}</div>`).join('')}</div></div>
    ${list.map(p=>{
      const l=Math.max(0,D.diff(p.start_date,min)/span*100);
      const w=Math.max(1.2,D.diff(p.end_date,p.start_date)/span*100);
      return `<div class="gantt-row"><div class="g-name" title="${esc(p.name)}">${esc(p.name)}</div>
        <div class="g-track"><div class="gantt-bar" style="left:${l}%;width:${w}%;background:${ptype(p.project_type_id).color}"
          data-go="#/media/projects/${p.id}" title="${esc(p.name)} · ${D.fmt(p.start_date)}–${D.fmt(p.end_date)}">${esc(p.name)}</div></div></div>`;
    }).join('')}
    <div class="gantt-today" style="left:calc(230px + (100% - 230px) * ${todayPct/100})" title="Today"></div>
  </div></div>`;
}

function viewPipeline(){
  const f=S.filters.pipe||(S.filters.pipe={type:[],owner:[],faculty:[],ptype:[],q:''});
  let ds=DB.deliverables.filter(d=>!d.deleted_at);
  if(isEmp())ds=ds.filter(d=>d.owner_id===S.me||isOnProject(d.project_id));
  if(f.q){const q=f.q.toLowerCase();ds=ds.filter(d=>(d.title+' '+proj(d.project_id).name).toLowerCase().includes(q));}
  if(f.type.length)ds=ds.filter(d=>f.type.includes(d.deliverable_type_id));
  if(f.owner.length)ds=ds.filter(d=>f.owner.includes(d.owner_id));
  if(f.faculty.length)ds=ds.filter(d=>f.faculty.includes(proj(d.project_id).faculty_served));
  if(f.ptype.length)ds=ds.filter(d=>f.ptype.includes(proj(d.project_id).project_type_id));
  const cols=['not_started','in_progress','in_review','changes_requested','approved','delivered'];
  const over=ds.filter(d=>d.due_date&&d.due_date<TODAY&&!['delivered','not_required','cancelled'].includes(d.status));
  return `<div class="page-head">
      <div><div class="crumb">Module 4 · §7.4 · wireframe W6</div><h1 class="page-title">Production Board</h1>
      <div class="page-sub">Department-wide Kanban of every deliverable ${reqid('FR-4.6','The production pipeline visualisation')}.
        This board is what replaces the Excel workbook — the unit is the <b>deliverable</b>, not a spreadsheet row.</div></div>
      <div class="page-actions">
        <button class="btn" data-act="exportOpen" data-what="pipeline">⇩ Export</button>
        <button class="btn primary" data-act="newDeliverable">＋ Deliverable</button></div></div>

    <div class="grid g4 sec">
      <div class="stat"><span class="stat-label">In flight</span><span class="stat-val">${ds.filter(d=>!['delivered','not_required','cancelled'].includes(d.status)).length}</span>
        <span class="stat-meta">across ${new Set(ds.map(d=>d.project_id)).size} projects</span></div>
      <div class="stat ${over.length?'alert':''}"><span class="stat-label">Overdue</span><span class="stat-val">${over.length}</span>
        <span class="stat-meta">${over.length?'oldest '+Math.max(...over.map(d=>D.diff(TODAY,d.due_date)))+'d':'clean'}</span></div>
      <div class="stat"><span class="stat-label">Awaiting review</span><span class="stat-val">${ds.filter(d=>d.status==='in_review').length}</span>
        <span class="stat-meta">${pendingVersionReviews().length} versions pending</span></div>
      <div class="stat"><span class="stat-label">Delivered (30d)</span><span class="stat-val">${ds.filter(d=>d.completed_at&&d.completed_at>=D.add(TODAY,-30)).length}</span>
        <span class="stat-meta">weighted ${ds.filter(d=>d.completed_at&&d.completed_at>=D.add(TODAY,-30)).reduce((s,d)=>s+d.weight,0)}</span></div>
    </div>

    <div class="card mb4"><div class="card-body tight"><div class="f wrap gap2 ac">
      <input class="inp" style="max-width:250px" placeholder="Filter deliverables…" value="${esc(f.q)}" oninput="ACTIONS.pipeQ({},this)">
      <button class="btn sm" data-menu="pipeType">Deliverable type${f.type.length?' · '+f.type.length:''} ▾</button>
      <button class="btn sm" data-menu="pipeOwner">Owner${f.owner.length?' · '+f.owner.length:''} ▾</button>
      <button class="btn sm" data-menu="pipeFaculty">Faculty${f.faculty.length?' · '+f.faculty.length:''} ▾</button>
      <button class="btn sm" data-menu="pipePtype">Project type${f.ptype.length?' · '+f.ptype.length:''} ▾</button>
      ${(f.q||f.type.length||f.owner.length||f.faculty.length||f.ptype.length)?'<button class="btn sm ghost" data-act="pipeClear">Clear</button>':''}
      <span class="ml-auto small mut3">${ds.length} deliverables</span>
    </div></div></div>

    <div class="kb">${cols.map(c=>{
      const list=ds.filter(d=>d.status===c).sort((a,b)=>(a.due_date||'9')<(b.due_date||'9')?-1:1);
      const wip=c==='in_review'?8:null;
      return `<div class="kb-col" data-drop="delivstatus:${c}">
        <div class="kb-col-head"><span class="kt">${statusPill(DELIV_STATUS,c)}</span>
          <span class="kc ${wip&&list.length>wip?'wip-over':''}">${list.length}${wip?'/'+wip:''}</span></div>
        <div class="kb-cards">${list.map(d=>{
          const over=d.due_date&&d.due_date<TODAY&&!['delivered'].includes(d.status);
          const p=proj(d.project_id);
          return `<div class="kb-card" draggable="true" data-drag="deliverable:${d.id}" data-drawer="deliverable:${d.id}">
            <div class="kc-top"><span class="code">${p.code}</span>
              <span style="color:${ptype(p.project_type_id).color}">${dtype(d.deliverable_type_id).icon}</span>
              ${over?`<span class="status st-danger" style="height:18px;font-size:10px"><span class="si">⚑</span>${D.diff(TODAY,d.due_date)}d</span>`:''}</div>
            <div class="kc-title">${esc(d.title)}</div>
            <div class="kc-foot">${avatar(d.owner_id,'xs')}<span class="trunc">${esc(user(d.owner_id).full_name.split(' ')[0])}</span>
              <span class="sp"></span><span>${d.due_date?D.fmt(d.due_date):'—'}</span></div></div>`;}).join('')}
        </div></div>`;}).join('')}</div>
    <div class="note mt4">Drag to change status. The board enforces the same rules the API does: a deliverable cannot be
      approved by its own submitter (BR-5), and Delivered requires an approved latest version unless the type is
      review-exempt (BR-6). Blocked drags explain themselves rather than silently reverting.</div>`;
}

function viewLibrary(){

  const q=(S.filters.libq||'').toLowerCase();
  let rows=DB.deliverables.filter(d=>!d.deleted_at).map(d=>({d,p:proj(d.project_id)}));
  if(q)rows=rows.filter(r=>(r.d.title+' '+r.p.name+' '+r.p.code+' '+r.p.faculty_served+' '+r.d.spec_notes).toLowerCase().includes(q));
  if(f.year.length)rows=rows.filter(r=>f.year.includes(r.p.academic_year_id));
  if(f.ptype.length)rows=rows.filter(r=>f.ptype.includes(r.p.project_type_id));
  if(f.faculty.length)rows=rows.filter(r=>f.faculty.includes(r.p.faculty_served));
  if(f.dtype.length)rows=rows.filter(r=>f.dtype.includes(r.d.deliverable_type_id));
  if(f.status.length)rows=rows.filter(r=>f.status.includes(r.d.status));
  if(f.owner.length)rows=rows.filter(r=>f.owner.includes(r.d.owner_id));

  const facetCount=(key,val)=>DB.deliverables.filter(d=>{const p=proj(d.project_id);
    return key==='year'?p.academic_year_id===val:key==='ptype'?p.project_type_id===val:
      key==='faculty'?p.faculty_served===val:key==='dtype'?d.deliverable_type_id===val:
      key==='status'?d.status===val:key==='owner'?d.owner_id===val:false;}).length;
  const facet=(title,key,opts)=>`<div class="facet">
    <div class="facet-h">${title}<span class="fc">${opts.length}</span></div>
    ${opts.map(o=>{const n=facetCount(key,o.v);if(!n)return '';
      return `<label class="facet-opt"><input type="checkbox" ${f[key].includes(o.v)?'checked':''}
        onchange="ACTIONS.libFacet({key:'${key}',v:'${String(o.v).replace(/'/g,"\\'")}'})">
        <span class="fn">${esc(o.l)}</span><span class="fq">${n}</span></label>`;}).join('')}</div>`;

  return `<div class="page-head">
      <div><div class="crumb">Module 5 · §7.5 · wireframe W8</div><h1 class="page-title">Media Library</h1>
      <div class="page-sub">Not a new store — a search and browse surface over Projects, Deliverables, Links and Reports
        ${reqid('§7.5','One fact, one record, many views')}. This is what answers “everything we produced for Faculty X this year, with links” in under two minutes (J5).</div></div>
      <div class="page-actions">
        <div class="btn-group"><button data-act="libView" data-v="table" class="${S.libView==='table'?'on':''}">▦ Table</button>
          <button data-act="libView" data-v="gallery" class="${S.libView==='gallery'?'on':''}">▩ Gallery</button></div>
        <button class="btn primary" data-act="exportOpen" data-what="library">⇩ Export ${rows.length} rows</button></div></div>

    <div class="card mb4"><div class="card-body tight">
      <div class="f gap2 ac wrap">

/* ---------- KIOSK (W7 / FR-6.6) — ≤ 15 s per item, one hand ---------- */
function openKiosk(){S.kiosk={step:1,pin:'',mode:null,items:[],ret:D.add(TODAY,1)};$('#kiosk').classList.add('on');drawKiosk();}
function closeKiosk(){$('#kiosk').classList.remove('on');S.kiosk.step=0;}
function drawKiosk(){
  const K=S.kiosk;let h='';
  if(K.step===1){
    h=`<div class="kiosk-inner">
      <div class="kiosk-h">Media Crew cupboard</div>
      <div class="kiosk-p">Scan your badge or enter your Nerve PIN</div>
      <div class="kiosk-dots">${[0,1,2,3].map(i=>`<i class="${K.pin.length>i?'f':''}"></i>`).join('')}</div>
      <div class="kiosk-pin">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>
        `<button data-k="${k}">${k}</button>`).join('')}</div>
      <div class="kiosk-timer">Device token scoped to equipment endpoints only · auto-logout 30s idle (§21)</div>
      <button class="btn ghost mt4" style="color:#9DBFB0" data-kexit>Exit kiosk</button></div>`;
  } else if(K.step===2){
    h=`<div class="kiosk-inner"><div class="kiosk-h">Hello, ${esc(user(S.me).full_name.split(' ')[0])}</div>
      <div class="kiosk-p">What are you doing?</div>
      <button class="kiosk-btn go" data-kmode="check_out">→ &nbsp;Check out</button>
      <button class="kiosk-btn" data-kmode="check_in">← &nbsp;Return</button>
      <button class="btn ghost mt4" style="color:#9DBFB0" data-kexit>Cancel</button></div>`;
  } else if(K.step===3){
    const pool=K.mode==='check_out'?DB.equipment_items.filter(e=>e.status==='available'):
      DB.equipment_items.filter(e=>{const h2=eqHolder(e.id);return h2&&h2.holder_id===S.me;});
    h=`<div class="kiosk-inner"><div class="kiosk-h">${K.mode==='check_out'?'Scan item QR':'Scan items to return'}</div>
      <div class="scanner"><div style="color:#9DBFB0">◱ camera viewfinder</div></div>
      ${K.items.length?`<div class="kiosk-list">${K.items.map(id=>{const e=equip(id);
        return `<div class="ki"><span style="font-size:18px">${ecat(e.category_id).icon}</span>
          <span style="flex:1;text-align:left"><b style="display:block">${esc(e.make+' '+e.model)}</b>
          <span style="font-size:11px;color:#9DBFB0">${e.asset_tag}</span></span>
          <button data-kremove="${id}" style="color:#FF9A90;font-size:18px">✕</button></div>`;}).join('')}</div>`:''}
      <div class="kiosk-p" style="font-size:13px">Simulate a scan:</div>
      <div class="f wrap gap2" style="justify-content:center;margin-bottom:16px">
        ${pool.slice(0,6).map(e=>`<button class="btn sm" data-kscan="${e.id}" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff">${e.asset_tag}</button>`).join('')
          ||'<span style="color:#9DBFB0">Nothing available to scan</span>'}</div>
      <button class="kiosk-btn go ${K.items.length?'':'disabled'}" data-knext>Continue (${K.items.length})</button>
      <button class="btn ghost" style="color:#9DBFB0" data-kexit>Cancel</button></div>`;
  } else if(K.step===4){
    h=`<div class="kiosk-inner"><div class="kiosk-h">${K.mode==='check_out'?'Confirm & set return date':'Confirm condition'}</div>
      <div class="kiosk-list">${K.items.map(id=>{const e=equip(id);
        return `<div class="ki"><span style="font-size:18px">${ecat(e.category_id).icon}</span>
          <span style="flex:1;text-align:left"><b style="display:block">${esc(e.make+' '+e.model)}</b>
          <span style="font-size:11px;color:#9DBFB0">${e.asset_tag} · condition ${e.condition}</span></span></div>`;}).join('')}</div>
      ${K.mode==='check_out'?`<div class="kiosk-p" style="font-size:14px">Return by</div>
        <div class="f gap2" style="justify-content:center;margin-bottom:20px">
          ${[1,2,3,5].map(n=>`<button class="btn ${K.ret===D.add(TODAY,n)?'primary':''}" data-kret="${D.add(TODAY,n)}"
            style="${K.ret===D.add(TODAY,n)?'':'background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff'}">${D.fmt(D.add(TODAY,n))}</button>`).join('')}</div>
        <div class="kiosk-timer" style="margin-bottom:16px">Default is shoot end + 1 day</div>`:
        `<div class="f gap2" style="justify-content:center;margin-bottom:20px">
          ${['excellent','good','fair','poor'].map(c=>`<button class="btn ${K.cond===c?'primary':''}" data-kcond="${c}"
            style="${K.cond===c?'':'background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff'}">${c}</button>`).join('')}</div>
        <div class="kiosk-timer" style="margin-bottom:16px">Condition worse than checkout auto-opens a damage report (BR-8)</div>`}
      <button class="kiosk-btn go" data-kconfirm>✓ &nbsp;Confirm</button>
      <button class="btn ghost" style="color:#9DBFB0" data-kexit>Cancel</button></div>`;
  } else if(K.step===5){
    h=`<div class="kiosk-inner"><div style="font-size:56px;color:var(--brand-400);margin-bottom:12px">✓</div>
      <div class="kiosk-h">Done — ${esc(user(S.me).full_name)}</div>
      <div class="kiosk-p">${K.items.length} item${K.items.length>1?'s':''} ${K.mode==='check_out'?'checked out':'returned'}
        ${K.mode==='check_out'?'· due back '+D.fmt(K.ret):''}</div>
      <div class="kiosk-list">${K.items.map(id=>{const e=equip(id);
        return `<div class="ki"><span style="flex:1;text-align:left">${esc(e.make+' '+e.model)}</span>
          <span style="font-size:11px;color:#9DBFB0">${e.asset_tag}</span></div>`;}).join('')}</div>
      <div class="kiosk-timer">Resetting in <span id="kcount">10</span>s · transaction visible on the availability dashboard instantly (AC-8)</div>
      <button class="btn ghost mt4" style="color:#9DBFB0" data-kexit>Exit now</button></div>`;
  }
  $('#kiosk').innerHTML=h;
  $$('#kiosk [data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='⌫')S.kiosk.pin=S.kiosk.pin.slice(0,-1);
    else if(k==='✓'){if(S.kiosk.pin.length>=4){S.kiosk.step=2;}}
    else if(S.kiosk.pin.length<4)S.kiosk.pin+=k;
    if(S.kiosk.pin.length===4&&k!=='⌫')setTimeout(()=>{S.kiosk.step=2;drawKiosk();},220);
    drawKiosk();});
  $$('#kiosk [data-kmode]').forEach(b=>b.onclick=()=>{S.kiosk.mode=b.dataset.kmode;S.kiosk.step=3;S.kiosk.cond='good';drawKiosk();});
  $$('#kiosk [data-kscan]').forEach(b=>b.onclick=()=>{const id=+b.dataset.kscan;
    if(!S.kiosk.items.includes(id))S.kiosk.items.push(id);drawKiosk();});
  $$('#kiosk [data-kremove]').forEach(b=>b.onclick=()=>{S.kiosk.items=S.kiosk.items.filter(i=>i!==+b.dataset.kremove);drawKiosk();});
  $$('#kiosk [data-kret]').forEach(b=>b.onclick=()=>{S.kiosk.ret=b.dataset.kret;drawKiosk();});
  $$('#kiosk [data-kcond]').forEach(b=>b.onclick=()=>{S.kiosk.cond=b.dataset.kcond;drawKiosk();});
  const nx=$('#kiosk [data-knext]');if(nx)nx.onclick=()=>{if(S.kiosk.items.length){S.kiosk.step=4;drawKiosk();}};
  const cf=$('#kiosk [data-kconfirm]');if(cf)cf.onclick=()=>{commitKiosk();};
  $$('#kiosk [data-kexit]').forEach(b=>b.onclick=closeKiosk);
  if(K.step===5){let n=10;const iv=setInterval(()=>{n--;const c=$('#kcount');if(c)c.textContent=n;
    if(n<=0){clearInterval(iv);S.kiosk={step:1,pin:'',mode:null,items:[]};drawKiosk();}},1000);}
}
function commitKiosk(){
  const K=S.kiosk;
  K.items.forEach(id=>{
    const e=equip(id);
    if(K.mode==='check_out'){
      DB.equipment_transactions.push({id:DB.equipment_transactions.length+1,equipment_item_id:id,booking_id:null,
        holder_id:S.me,action:'check_out',quantity:1,condition_noted:e.condition,expected_return_at:K.ret,
        occurred_at:NOW.toISOString().slice(0,19),recorded_via:'kiosk',recorded_by:S.me});
      audit(S.me,'equipment.check_out','equipment_item',id,{status:'available'},{status:'checked_out',holder:S.me});
    } else {
      DB.equipment_transactions.push({id:DB.equipment_transactions.length+1,equipment_item_id:id,booking_id:null,
        holder_id:S.me,action:'check_in',quantity:1,condition_noted:K.cond,expected_return_at:null,
        occurred_at:NOW.toISOString().slice(0,19),recorded_via:'kiosk',recorded_by:S.me});
      audit(S.me,'equipment.check_in','equipment_item',id,{status:'checked_out'},{status:'available',condition:K.cond});
      const rank={excellent:4,good:3,fair:2,poor:1};
      if(rank[K.cond]<rank[e.condition]){                                    /* BR-8 */
        DB.maintenance_records.push({id:DB.maintenance_records.length+1,equipment_item_id:id,kind:'damage_report',
          description:'Condition on return ('+K.cond+') worse than at checkout ('+e.condition+') — auto-opened at kiosk.',
          cost:null,vendor_id:null,reported_by:S.me,started_at:TODAY,resolved_at:null,next_due_at:null});
        e.condition=K.cond;e.status='maintenance';
        toast('BR-8: condition dropped — damage report auto-opened, custodian notified','warn');
      }
    }
  });
  trgEquipStatus();
  if(window.__MO_LIVE__){
    const _kx=K.items.map(id=>K.mode==='check_out'
      ? MO_API.post('/equipment/'+id+'/checkout',{recorded_via:'kiosk',expected_return_at:K.ret})
      : MO_API.post('/equipment/'+id+'/checkin',{recorded_via:'kiosk',condition_noted:K.cond}));
    moSync(Promise.all(_kx));
  }
  S.kiosk.step=5;drawKiosk();
  if(S.route.includes('equipment'))setTimeout(render,60);
}

/* ==========================================================================
   MODULE 11 — UNIFIED CALENDAR (§7.11)
   ========================================================================== */
function calendarGrid(monthISO,eventsFor){
  const first=D.parse(monthISO); first.setDate(1);
  const startDow=first.getDay();
  const start=D.add(D.iso(first),-startDow);
  const cells=[];for(let i=0;i<42;i++)cells.push(D.add(start,i));
  return `<div class="cal">
    <div class="cal-dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.map(d=>{
      const other=D.parse(d).getMonth()!==first.getMonth();
      const evs=eventsFor(d)||[];
      const hol=DB.holidays.find(h=>h.date===d);
      return `<div class="cal-cell ${other?'other':''} ${d===TODAY?'today':''}">
        <div class="cal-num">${D.parse(d).getDate()}${hol?`<span class="tag" style="font-size:9px">${esc(hol.name)}</span>`:''}</div>
        ${evs.slice(0,4).map(e=>`<div class="cal-ev" style="background:${e.c}"
          ${e.go?`data-go="${e.go}"`:''} ${e.drawer?`data-drawer="${e.drawer}"`:''} title="${esc(e.t)}">${esc(e.t)}</div>`).join('')}
        ${evs.length>4?`<div class="cal-more">+${evs.length-4} more</div>`:''}</div>`;}).join('')}
    </div></div>`;
}
function viewCalendar(){
  const L=S.cal.layers;
  const layerDefs=[['shoots','Shoots','var(--info)'],['tours','Tours','var(--cat-2)'],
    ['deadlines','Deliverable deadlines','var(--warn)'],['projects','Project spans','var(--brand-500)'],
    ['leave','Leave','var(--cat-6)'],['bookings','Equipment bookings','var(--cat-4)'],['holidays','Holidays','var(--cat-3)']];
  const scoped=uid=>isEmp()?uid===S.me:true;
  const eventsFor=(day)=>{
    const out=[];
    if(L.shoots)DB.shoots.filter(s=>s.shoot_date===day&&s.status!=='cancelled')
      .filter(s=>isEmp()?DB.shoot_crew.some(c=>c.shoot_id===s.id&&c.user_id===S.me):true)
      .forEach(s=>{const p=proj(s.project_id);
        if(p.project_type_id===2&&!L.tours)return;
        out.push({c:p.project_type_id===2?'var(--cat-2)':'var(--info)',t:s.call_time+' '+s.title,drawer:'shoot:'+s.id});});
    if(L.deadlines)DB.deliverables.filter(d=>d.due_date===day&&!['delivered','cancelled','not_required'].includes(d.status))
      .filter(d=>scoped(d.owner_id)).forEach(d=>out.push({c:'var(--warn)',t:'◆ '+d.title,drawer:'deliverable:'+d.id}));
    if(L.projects)DB.projects.filter(p=>p.start_date===day||p.end_date===day)
      .forEach(p=>out.push({c:ptype(p.project_type_id).color,t:(p.start_date===day?'▶ ':'⤴ ')+p.name,go:'#/media/projects/'+p.id}));
    if(L.leave)DB.leave_requests.filter(l=>l.status==='approved'&&day>=l.starts_on&&day<=l.ends_on)
      .filter(l=>scoped(l.user_id)).forEach(l=>out.push({c:'var(--cat-6)',t:'◐ '+user(l.user_id).full_name.split(' ')[0]+' leave'}));
    if(L.bookings)DB.equipment_bookings.filter(b=>['reserved','active'].includes(b.status)&&day>=b.starts_at&&day<=b.ends_at)
      .filter(b=>scoped(b.user_id)).forEach(b=>out.push({c:'var(--cat-4)',t:'▣ '+equip(b.equipment_item_id).asset_tag,
        go:'#/media/equipment/'+equip(b.equipment_item_id).asset_tag}));
    if(L.holidays)DB.holidays.filter(h=>h.date===day).forEach(h=>out.push({c:'var(--cat-3)',t:'★ '+h.name}));
    return out;
  };
  const m=D.parse(S.cal.month);
  const agenda=[];for(let i=0;i<21;i++){const d=D.add(TODAY,i);const e=eventsFor(d);if(e.length)agenda.push({d,e});}
  return `<div class="page-head">
      <div><div class="crumb">Module 11 · §7.11</div><h1 class="page-title">Calendar</h1>
      <div class="page-sub">One calendar, layered ${reqid('FR-11.1','Layers toggleable, colour-coded, month/week/day/agenda')}.
        ${isEmp()?'Scoped to your work plus department events (FR-11.2).':'Scoped to your team / department.'}</div></div>
      <div class="page-actions">
        <div class="btn-group">${['month','agenda'].map(v=>`<button data-act="calView" data-v="${v}" class="${S.cal.view===v?'on':''}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
        <button class="btn" data-act="icsFeed">⇩ ICS feed</button>
        <button class="btn" data-act="calPrev">‹</button>
        <button class="btn" data-act="calToday">${D.month(S.cal.month)}</button>
        <button class="btn" data-act="calNext">›</button></div></div>

    <div class="card mb4"><div class="card-body tight"><div class="f wrap gap2 ac">
      <span class="small b">Layers</span>
      ${layerDefs.map(([k,l,c])=>`<button class="chip ${L[k]?'sel':''}" data-act="calLayer" data-k="${k}">
        <span class="dot" style="background:${c};opacity:${L[k]?1:.3}"></span>${l}</button>`).join('')}
      <span class="ml-auto small mut3">Drag to reschedule is permission-checked and logged (FR-11.3)</span>
    </div></div></div>

    ${S.cal.view==='month'?calendarGrid(S.cal.month,eventsFor):
      `<div class="card"><div class="card-body flush">${agenda.map(({d,e})=>`
        <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
          <div class="between mb2"><b class="small">${D.fmtLong(d)}</b><span class="xsmall mut3">${D.rel(d)}</span></div>
          ${e.map(ev=>`<button class="f ac gap2 mb2" style="width:100%;text-align:left"

function perfMe(uid){
  const snaps=DB.performance_snapshots.filter(s=>s.user_id===uid);
  const last=snaps[snaps.length-1]||{};
  const prev=snaps[snaps.length-2]||{};
  const d=(a,b)=>b?Math.round((a-b)/b*100):0;
  const metrics=[['Hours logged','hours_logged','h'],['Tasks logged','tasks_count',''],
    ['Deliverables completed','deliverables_completed',''],['Weighted output','weighted_output',''],
    ['On-time delivery','on_time_pct','%'],['Reporting consistency','consistency_pct','%'],['Projects touched','projects_touched','']];
  return `<div class="grid g4 sec">${metrics.slice(0,4).map(([l,k,u])=>`
    <div class="stat"><span class="stat-label">${l}</span>
      <span class="stat-val">${last[k]||0}<small>${u}</small></span>

function leaveConflicts(l){

    DB.shoot_crew.some(c=>c.shoot_id===s.id&&c.user_id===l.user_id));

   ========================================================================== */
const ANALYTICS_REPORTS=[
  ['productivity','Employee productivity','Hours, tasks and weighted output by person or team over a period'],
  ['projects','Project completion','On-time %, cycle time by project type'],
  ['utilization','Team utilisation','Logged hours vs working hours'],
  ['deliverables','Deliverable throughput','By type, status and faculty'],
  ['equipment','Equipment usage','Utilisation, damage frequency, cost of ownership'],
  ['leave','Leave statistics','Taken by type, by month, coverage impact'],
  ['kra','KRA trends','Achievement distribution across the cycle'],
  ['pack','Department monthly pack','The leadership bundle generated by AUTO-11 on the 1st']
];
function viewAnalytics(which){
  if(isEmp())return roleDenied('Department analytics are for Team Leads and Admins (§16 / AC-10).');
  const w=which||'productivity';
  const range=S.filters.anRange||'3M';
  const days=range==='1M'?30:range==='3M'?90:range==='6M'?180:365;
  const from=D.add(TODAY,-days);
  return `<div class="page-head">
      <div><div class="crumb">Module 12 · §7.12</div><h1 class="page-title">Analytics</h1>
      <div class="page-sub">Every report is a chart + table duo with drill-down to the underlying records
        ${reqid('FR-12.2','Filters, chart+table, drill-down')}. Metric definitions are documented in-app so disputes cite
        definitions, not feelings ${reqid('FR-12.5','ℹ per metric')}.</div></div>
      <div class="page-actions">
        <div class="btn-group">${['1M','3M','6M','1Y'].map(r=>`<button data-act="anRange" data-v="${r}" class="${range===r?'on':''}">${r}</button>`).join('')}</div>
        <button class="btn" data-act="metricDefs">ℹ Metric definitions</button>
        <button class="btn primary" data-act="exportOpen" data-what="analytics">⇩ Export</button></div></div>

    <div class="tabs">${ANALYTICS_REPORTS.map(([k,l])=>`<a href="#/media/analytics/${k}"
      style="padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none;color:${w===k?'var(--brand-600)':'var(--text-2)'};
      border-bottom:2px solid ${w===k?'var(--brand-500)':'transparent'};margin-bottom:-1px;white-space:nowrap">${l}</a>`).join('')}</div>

    ${w==='productivity'?anProductivity(from):w==='projects'?anProjects(from):w==='utilization'?anUtilization(from):
      w==='deliverables'?anDeliverables(from):w==='equipment'?eqAnalytics():w==='leave'?anLeave():
      w==='kra'?anKRA():anPack(from)}`;
}
function anProductivity(from){
  const scope=isAdmin()?DB.users.filter(u=>u.is_active).map(u=>u.id):myTeamIds();
  const rows=scope.map(id=>({id,h:userHours(id,from,TODAY),
    d:DB.deliverables.filter(x=>x.owner_id===id&&x.completed_at&&x.completed_at>=from).length,
    w:DB.deliverables.filter(x=>x.owner_id===id&&x.completed_at&&x.completed_at>=from).reduce((s,x)=>s+x.weight,0),
    t:DB.report_tasks.filter(t=>{const r=DB.daily_reports.find(r=>r.id===t.daily_report_id);
      return r&&r.user_id===id&&r.report_date>=from;}).length,
    c:consistency(id,90)})).sort((a,b)=>b.w-a.w);
  return `<div class="grid g2 sec">
    <div class="card"><div class="card-head"><h3>Weighted output by person</h3></div>
      <div class="card-body">${chartBar(rows.map(r=>({l:user(r.id).full_name,s:user(r.id).full_name.split(' ')[0].slice(0,6),v:r.w})),{h:200})}</div></div>
    <div class="card"><div class="card-head"><h3>Hours by task category</h3></div>
      <div class="card-body">${(()=>{
        const cats=DB.task_categories.map(c=>({l:c.name,c:'var(--cat-'+((c.id%8)+1)+')',
          v:Math.round(DB.report_tasks.filter(t=>t.task_category_id===c.id&&(()=>{const r=DB.daily_reports.find(r=>r.id===t.daily_report_id);
            return r&&r.report_date>=from&&scope.includes(r.user_id);})()).reduce((s,t)=>s+t.minutes,0)/60)})).filter(c=>c.v);
        return `<div class="f gap4 ac wrap">${chartDonut(cats,{size:150,center:cats.reduce((s,c)=>s+c.v,0)+'h',centerSub:'logged'})}
          <div style="flex:1">${legend(cats)}</div></div>`;})()}</div></div>
  </div>
  <div class="card"><div class="card-head"><h3>Detail</h3><div class="ca"><span class="chip">${D.fmt(from)} → ${D.fmt(TODAY)}</span></div></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Person</th><th>Capacity</th><th class="num">Hours</th><th class="num">Tasks</th>
        <th class="num">Deliverables</th><th class="num">Weighted output</th><th class="num">Consistency</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="click" data-go="#/media/team/${r.id}">
        <td><div class="f ac gap2">${avatarP(r.id,'sm')}<span class="t-main">${esc(user(r.id).designation)}</span></div></td>
        <td class="small">${esc(capacityOf(r.id))}</td>
        <td class="num">${r.h.toFixed(0)}h</td><td class="num">${r.t}</td>
        <td class="num">${r.d}</td><td class="num b">${r.w}</td><td class="num">${r.c}%</td></tr>`).join('')}
      </tbody></table></div></div></div>`;
}
function anProjects(from){
  const byType=DB.project_types.map(t=>{
    const ps=DB.projects.filter(p=>p.project_type_id===t.id);
    const done=ps.filter(p=>['delivered','completed','archived'].includes(p.status));
    const cycles=done.map(p=>D.diff(p.end_date,p.start_date)).filter(n=>n>0).sort((a,b)=>a-b);
    return {t,count:ps.length,done:done.length,median:cycles.length?cycles[Math.floor(cycles.length/2)]:0};});
  const dl=DB.deliverables.filter(d=>d.completed_at&&d.completed_at>=from&&d.due_date);
  const onTime=dl.filter(d=>d.completed_at<=d.due_date).length;
  return `<div class="grid g4 sec">
    <div class="stat"><span class="stat-label">Projects (all)</span><span class="stat-val">${DB.projects.length}</span>
      <span class="stat-meta">${DB.projects.filter(p=>['planning','in_production','in_review'].includes(p.status)).length} active</span></div>
    <div class="stat"><span class="stat-label">On-time delivery</span><span class="stat-val">${dl.length?Math.round(onTime/dl.length*100):0}<small>%</small></span>
      <span class="stat-meta">${onTime} of ${dl.length} delivered ≤ due date</span></div>
    <div class="stat"><span class="stat-label">Stall rate</span><span class="stat-val">${(()=>{const a=DB.projects.filter(p=>p.status==='in_production').length;
      return a?Math.round(idleProjects().length/a*100):0;})()}<small>%</small></span>
      <span class="stat-meta">${idleProjects().length} idle (AUTO-7)</span></div>
    <div class="stat"><span class="stat-label">Median cycle time</span><span class="stat-val">${(()=>{const all=byType.filter(b=>b.median).map(b=>b.median);
      return all.length?Math.round(all.reduce((s,n)=>s+n,0)/all.length):0;})()}<small>d</small></span>
      <span class="stat-meta">approved → completed</span></div></div>
  <div class="grid g2 sec">
    <div class="card"><div class="card-head"><h3>Projects by type</h3></div>
      <div class="card-body"><div class="f gap4 ac wrap">
        ${chartDonut(byType.filter(b=>b.count).map(b=>({l:b.t.name,v:b.count,c:b.t.color})),{size:150,center:String(DB.projects.length),centerSub:'projects'})}
        <div style="flex:1">${legend(byType.filter(b=>b.count).map(b=>({l:b.t.name+' ('+b.count+')',c:b.t.color})))}</div></div></div></div>
    <div class="card"><div class="card-head"><h3>Median cycle time by type</h3></div>
      <div class="card-body">${chartBar(byType.filter(b=>b.median).map(b=>({l:b.t.name,s:b.t.name.split(' ')[0],v:b.median,c:b.t.color})),{h:190,unit:'d'})}</div></div>
  </div>
  <div class="card"><div class="card-head"><h3>Per-project detail</h3></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Project</th><th>Type</th><th>Status</th><th class="num">Progress</th><th class="num">Deliverables</th>
        <th class="num">Hours</th><th class="num">Span</th><th class="num">Crew</th></tr></thead>
      <tbody>${DB.projects.map(p=>{const ds=projectDeliverables(p.id);
        return `<tr class="click" data-go="#/media/projects/${p.id}">
        <td><div class="t-main">${esc(p.name)}</div><div class="t-sub code">${p.code}</div></td>
        <td class="small">${esc(ptype(p.project_type_id).name)}</td><td>${statusPill(PROJ_STATUS,p.status)}</td>
        <td class="num">${projectProgress(p.id)}%</td>
        <td class="num">${ds.filter(d=>d.status==='delivered').length}/${ds.length}</td>
        <td class="num">${projectHours(p.id).toFixed(0)}h</td>
        <td class="num">${D.diff(p.end_date,p.start_date)}d</td>
        <td class="num">${DB.project_assignments.filter(a=>a.project_id===p.id&&!a.removed_at).length}</td></tr>`;}).join('')}
      </tbody></table></div></div></div>`;
}
function anUtilization(from){
  const scope=isAdmin()?DB.users.filter(u=>u.is_active).map(u=>u.id):myTeamIds();
  let working=0;for(let i=0;i<D.diff(TODAY,from);i++){if(D.isWorking(D.add(from,i))&&!isHoliday(D.add(from,i)))working++;}
  const rows=scope.map(id=>{const h=userHours(id,from,TODAY);
    return {id,h,cap:working*8,u:Math.round(h/(working*8)*100)};}).sort((a,b)=>b.u-a.u);
  return `<div class="note mb4"><b>Utilisation = logged hours ÷ (working days × 8h).</b> ${working} working days in the window
    (Sundays and holidays excluded). Utilisation above 100% is a warning sign, not a trophy — check the load index and AUTO-9.</div>
  <div class="card mb4"><div class="card-head"><h3>Utilisation by person</h3></div>
    <div class="card-body">${chartBar(rows.map(r=>({l:user(r.id).full_name,s:user(r.id).full_name.split(' ')[0].slice(0,6),v:r.u,
      c:r.u>105?'var(--danger)':r.u<50?'var(--warn)':'var(--brand-500)'})),{h:200,unit:'%'})}
      ${legend([{c:'var(--brand-500)',l:'50–105% healthy'},{c:'var(--danger)',l:'>105% overloaded'},{c:'var(--warn)',l:'<50% check in privately'}])}</div></div>
  <div class="card"><div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Person</th><th class="num">Logged</th><th class="num">Capacity</th><th style="width:200px">Utilisation</th><th class="num">Load index</th></tr></thead>
    <tbody>${rows.map(r=>{const w=workload(r.id);
      return `<tr class="click" data-go="#/media/team/${r.id}">
      <td><div class="f ac gap2">${avatarP(r.id,'sm')}<span class="t-main">${esc(user(r.id).designation)}</span></div></td>
      <td class="num">${r.h.toFixed(0)}h</td><td class="num">${r.cap}h</td>
      <td><div class="f ac gap2">${bar(Math.min(100,r.u),r.u>105?'danger':r.u<50?'warn':'')}<span class="xsmall b">${r.u}%</span></div></td>
      <td class="num" style="${w.over?'color:var(--danger);font-weight:700':''}">${w.load}%</td></tr>`;}).join('')}
    </tbody></table></div></div></div>`;
}
function anDeliverables(from){
  const byType=DB.deliverable_types.map(t=>({l:t.name,s:t.name.split(' ')[0],
    v:DB.deliverables.filter(d=>d.deliverable_type_id===t.id).length})).filter(x=>x.v);
  const byStatus=Object.keys(DELIV_STATUS).map(k=>({l:DELIV_STATUS[k].l,v:DB.deliverables.filter(d=>d.status===k).length,
    c:{not_started:'var(--cat-8)',in_progress:'var(--info)',in_review:'var(--warn)',changes_requested:'var(--danger)',
       approved:'var(--brand-400)',delivered:'var(--success)',not_required:'var(--border)',cancelled:'var(--border-strong)'}[k]})).filter(x=>x.v);
  const byFaculty={};DB.deliverables.forEach(d=>{const f=proj(d.project_id).faculty_served;byFaculty[f]=(byFaculty[f]||0)+1;});
  return `<div class="grid g3 sec">
    <div class="card"><div class="card-head"><h3>By type</h3></div>
      <div class="card-body">${chartBar(byType,{h:180})}</div></div>
    <div class="card"><div class="card-head"><h3>By status</h3></div>
      <div class="card-body"><div class="f gap3 ac wrap">${chartDonut(byStatus,{size:140,center:String(DB.deliverables.length),centerSub:'total'})}
        <div style="flex:1">${legend(byStatus.map(s=>({l:s.l+' ('+s.v+')',c:s.c})))}</div></div></div></div>
    <div class="card"><div class="card-head"><h3>By faculty served</h3></div>
      <div class="card-body">${chartBar(Object.entries(byFaculty).map(([f,v])=>({l:f,s:f.replace('Faculty of ','').slice(0,8),v})).sort((a,b)=>b.v-a.v).slice(0,8),{h:180})}</div></div>
  </div>
  <div class="card"><div class="card-head"><h3>Throughput — delivered per week</h3></div>
    <div class="card-body">${(()=>{const weeks=[];
      for(let i=11;i>=0;i--){const end=D.add(TODAY,-i*7),start=D.add(end,-6);
        weeks.push({l:D.fmt(start),s:D.fmt(start).slice(0,2),
          v:DB.deliverables.filter(d=>d.completed_at&&d.completed_at>=start&&d.completed_at<=end).length});}
      return chartBar(weeks,{h:180});})()}</div></div>`;
}
function anLeave(){
  const byType=DB.leave_types.map(t=>({l:t.name,s:t.name.split(' ')[0],
    v:DB.leave_requests.filter(l=>l.leave_type_id===t.id&&l.status==='approved')
      .reduce((s,l)=>s+D.diff(l.ends_on,l.starts_on)+1,0)})).filter(x=>x.v);
  return `<div class="grid g2 sec">
    <div class="card"><div class="card-head"><h3>Days taken by type</h3></div>
      <div class="card-body">${chartBar(byType,{h:190,unit:'d'})}</div></div>
    <div class="card"><div class="card-head"><h3>Requests by status</h3></div>
      <div class="card-body">${(()=>{const st=['approved','pending','rejected','cancelled'].map(k=>({l:LEAVE_STATUS[k].l,
        v:DB.leave_requests.filter(l=>l.status===k).length,
        c:{approved:'var(--success)',pending:'var(--warn)',rejected:'var(--danger)',cancelled:'var(--border)'}[k]})).filter(x=>x.v);
        return `<div class="f gap4 ac">${chartDonut(st,{size:150,center:String(DB.leave_requests.length)})}
          <div style="flex:1">${legend(st.map(s=>({l:s.l+' ('+s.v+')',c:s.c})))}</div></div>`;})()}</div></div>
  </div>${leaveBalances()}`;
}
function anKRA(){
  const cycle=DB.kra_cycles.find(c=>c.status==='active');
  const withKra=[...new Set(DB.kras.filter(k=>k.kra_cycle_id===cycle.id).map(k=>k.user_id))];
  return `<div class="grid g4 sec">
    <div class="stat"><span class="stat-label">Cycle</span><span class="stat-val" style="font-size:17px;padding-top:9px">${esc(cycle.label)}</span>
      <span class="stat-meta">${D.diff(cycle.ends_on,TODAY)}d remaining</span></div>
    <div class="stat"><span class="stat-label">People with KRAs</span><span class="stat-val">${withKra.length}<small>/${DB.users.filter(u=>u.is_active).length}</small></span>
      <span class="stat-meta">${DB.users.filter(u=>u.is_active).length-withKra.length} unset</span></div>
    <div class="stat"><span class="stat-label">Auto-metric KRAs</span><span class="stat-val">${DB.kras.filter(k=>k.metric_source==='auto').length}</span>
      <span class="stat-meta">of ${DB.kras.length} total — no self-reporting</span></div>
    <div class="stat"><span class="stat-label">Self reviews done</span><span class="stat-val">${DB.kra_reviews.filter(r=>r.phase==='self').length}</span>
      <span class="stat-meta">${DB.kra_reviews.filter(r=>r.phase==='manager').length} manager reviews</span></div></div>
  <div class="card"><div class="card-head"><h3>KRA items — ${esc(cycle.label)}</h3></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Person</th><th>KRA</th><th>Source</th><th>Target</th><th class="num">Weight</th></tr></thead>
      <tbody>${DB.kras.filter(k=>k.kra_cycle_id===cycle.id).map(k=>`<tr>
        <td><div class="f ac gap2">${avatar(k.user_id,'sm')}</div></td>
        <td class="t-main">${esc(k.title)}</td>
        <td>${k.metric_source==='auto'?`<span class="chip sel mono">${esc(k.auto_metric_key)}</span>`:'<span class="chip">manual</span>'}</td>
        <td class="small mut">${esc(k.target_text)}</td><td class="num b">${k.weight}%</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card-foot">Auto-metric keys must exist in the metric registry (VR-12). Registry: ${Object.keys(METRIC_DEFS).length} canonical metrics (§19).</div></div>`;
}
function anPack(from){
  const scope=DB.users.filter(u=>u.is_active).map(u=>u.id);
  const hrs=scope.reduce((s,i)=>s+userHours(i,from,TODAY),0);
  const del=DB.deliverables.filter(d=>d.completed_at&&d.completed_at>=from);
  return `<div class="note mb4"><b>Generated automatically by AUTO-11</b> on the 1st at 02:00 and emailed to Admin and the CEO office.
    Exports are presentation-grade with university branding ${reqid('FR-12.4','PDF/XLSX for leadership')} — leadership never logs in daily,
    so the export <em>is</em> the product for them (persona P6).</div>
  <div class="grid g4 sec">
    <div class="stat"><span class="stat-label">Total hours logged</span><span class="stat-val">${hrs.toFixed(0)}<small>h</small></span>
      <span class="stat-meta">${scope.length} people</span></div>
    <div class="stat"><span class="stat-label">Deliverables shipped</span><span class="stat-val">${del.length}</span>
      <span class="stat-meta">weighted ${del.reduce((s,d)=>s+d.weight,0)}</span></div>
    <div class="stat"><span class="stat-label">Shoots completed</span><span class="stat-val">${DB.shoots.filter(s=>s.status==='done').length}</span>
      <span class="stat-meta">${DB.shoots.filter(s=>s.shoot_date>=TODAY).length} scheduled ahead</span></div>
    <div class="stat"><span class="stat-label">Projects delivered</span><span class="stat-val">${DB.projects.filter(p=>['delivered','completed'].includes(p.status)).length}</span>
      <span class="stat-meta">${DB.projects.filter(p=>p.status==='in_production').length} in production</span></div></div>

  <div class="ai-box mb4"><div class="between mb3"><b>Executive summary</b><span class="ai-chip">✦ AI-8 draft</span></div>
    <p class="small">In the ${D.diff(TODAY,from)} days to ${D.fmt(TODAY)}, the department logged <b>${hrs.toFixed(0)} hours</b> across
    ${DB.projects.filter(p=>['in_production','in_review','delivered','completed'].includes(p.status)).length} live projects and shipped
    <b>${del.length} deliverables</b>. The Admissions 2026-27 brand film reached v3 and is with the CEO office;
    YEEP 2026 closed all but the aftermovie. Convocation 2026 preparation is the dominant load for August —
    the two open risks are the 300m SDI cable purchase and a single ageing camera body (EQ-CAM-006) still in rotation.</p>
    <div class="f gap2 mt3"><button class="btn sm">Edit draft</button><button class="btn sm ghost">Regenerate</button></div>
    <div class="xsmall mut3 mt2">Numbers stay computed; only the prose is drafted. Always labelled, always editable, never auto-committed.</div></div>

  <div class="grid g2 sec">
    <div class="card"><div class="card-head"><h3>Output by project type</h3></div>
      <div class="card-body">${chartBar(DB.project_types.map(t=>({l:t.name,s:t.name.split(' ')[0],c:t.color,
        v:DB.deliverables.filter(d=>proj(d.project_id).project_type_id===t.id&&d.status==='delivered').length})).filter(x=>x.v),{h:190})}</div></div>
    <div class="card"><div class="card-head"><h3>Faculties served</h3></div>
      <div class="card-body">${(()=>{const f={};DB.projects.forEach(p=>f[p.faculty_served]=(f[p.faculty_served]||0)+1);
        return chartBar(Object.entries(f).map(([k,v])=>({l:k,s:k.replace('Faculty of ','').slice(0,7),v})).sort((a,b)=>b.v-a.v),{h:190});})()}</div></div>
  </div>
  <div class="f gap2"><button class="btn primary" data-act="exportOpen" data-what="pack">⇩ Download pack (PDF)</button>
    <button class="btn" data-act="exportOpen" data-what="pack">⇩ XLSX</button>
    <button class="btn" data-act="schedulePack">◷ Delivery schedule</button></div>`;
}

function viewBoards(){
  if(isEmp())return roleDenied('Management boards are for Team Leads and Admins — employees use the project Kanban scoped to their own work (FR-14.1).');
  const b=DB.boards.find(x=>x.id===S.board)||DB.boards[0];
  if(!b) return `<div class="page-head"><div><div class="crumb">Module 14 · §7.14</div>
      <h1 class="page-title">Management Boards</h1>
      <div class="page-sub">Kanban boards for cross-project coordination — war rooms, monthly planning, department ops.
        Visible to Admins and Team Leads (FR-14.1).</div></div></div>
    <div class="card"><div class="empty"><div class="e-ico">▥</div><h4>No boards yet</h4>
      <p>Management boards will appear here once they’re created.</p></div></div>`;
  const cols=DB.board_columns.filter(c=>c.board_id===b.id).sort((x,y)=>x.sort_order-y.sort_order);
  return `<div class="page-head">
      <div><div class="crumb">Module 14 · §7.14</div><h1 class="page-title">Management Boards</h1>
      <div class="page-sub">Visible to Admin and Team Leads only ${reqid('FR-14.1','Employees never see management boards')}.
        A card can be free-standing or linked to a Project/Deliverable — linked cards show live status and deep-link,
        otherwise boards drift from reality and die.</div></div>
      <div class="page-actions">
        <button class="btn" data-menu="boardSwitch">${esc(b.name)} ▾</button>
        <button class="btn" data-act="boardSettings" data-bid="${b.id}">⚙</button>
        <button class="btn primary" data-act="newCard" data-bid="${b.id}">＋ Card</button></div></div>

    <div class="note mb4"><b>${esc(b.description)}</b> · Two-way sync with linked objects is
      <b>${b.sync_status?'on':'off'}</b> for this board — moving a linked card ${b.sync_status?'updates':'does not update'}

/* AI Assist is computed live from /api/v1/media/ai/* — cached in MO_AI, refreshed

let MO_AI=null, MO_AI_LOADING=false;
function roleDenied(msg){
  return `<div class="empty" style="padding:64px 20px"><div class="e-ico">⚿</div>
    <h4>Not available for your role</h4><p>${esc(msg)}</p>

/* Load the REAL append-only audit trail from the server (FR-13.3). Remaps the
   server's text actor_id to the prototype int so user()/avatar() resolve. Loads
   once per session (auditFilter re-renders client-side); pass force to refetch. */
function loadAudit(force){
  if(!window.__MO_LIVE__)return;
  if(S._auditLoaded&&!force)return;
  S._auditLoaded=true;
  MO_API.get('/audit').then(r=>{
    DB.audit_logs=(r.audit||[]).map(a=>({...a,
      actor_id:(DB.users.find(x=>x.real_id===a.actor_id)||{}).id ?? a.actor_id,
      user_agent:a.user_agent||''}));
    render();
  }).catch(()=>{S._auditLoaded=false;});
}
async function loadAI(force){
  if(MO_AI_LOADING||(MO_AI&&!force))return;
  MO_AI_LOADING=true; if(force)MO_AI=null;
  try{ const [digest,dups,fc]=await Promise.all([
      MO_API.get('/ai/digest'),MO_API.get('/ai/duplicates'),MO_API.get('/ai/forecast')]);
    MO_AI={digest,dups,fc}; }
  catch(e){ MO_AI={error:e.message}; }
  MO_AI_LOADING=false;
  if(S.route==='#/media/ai')render();
}
function viewAI(){
  if(window.__MO_LIVE__&&!MO_AI&&!MO_AI_LOADING)loadAI();
  const A=MO_AI;
  const head=`<div class="page-head">
      <div><div class="crumb">§7.15 — cross-cutting · computed live</div><h1 class="page-title">AI Assist</h1>
      <div class="page-sub">Applied only where it removes real work — every output is labelled, editable, and never
        auto-commits a decision. The insights below are computed live from your data. <b>Explicitly rejected:</b>
        AI scoring of employee performance and AI-written daily reports.</div></div>
      <div class="page-actions"><button class="btn" data-act="aiRegen">↻ Regenerate</button>
        <button class="btn" data-act="aiSettings">⚙ AI settings</button></div></div>`;
  const register=`<div class="sec"><div class="sec-head"><h2 class="sec-title">Feature register</h2>
      <span class="small mut3">Priority: S = Should · C = Could</span></div>
      <div class="grid g2">${AI_FEATURES.map(([id,name,desc,val,pri,on])=>`

          <div class="between mb2"><div class="f ac gap2"><span class="reqid">${id}</span><b>${esc(name)}</b></div>

        </div></div>`).join('')}</div></div>`;
  if(!window.__MO_LIVE__) return head+`<div class="note warn mb5">Sign in to Nerve to load live AI insights.</div>`+register;
  if(!A) return head+`<div class="ai-box mb5"><div class="skel" style="height:18px;width:38%;margin-bottom:14px"></div>
      <div class="skel" style="height:64px"></div></div>
      <div class="grid g2 mb5"><div class="ai-box"><div class="skel" style="height:80px"></div></div>
      <div class="ai-box"><div class="skel" style="height:80px"></div></div></div>`+register;
  if(A.error) return head+`<div class="note danger mb5">Couldn't load AI insights: ${esc(A.error)}</div>`+register;

  const dg=A.digest, an=dg.anomalies||{over_hours:[],blocked:[],stalls:[]};
  const clean=!an.over_hours.length&&!an.stalls.length&&!an.blocked.length;
  const digestBox=`<div class="ai-box mb5">
      <div class="between mb3"><b>Weekly digest — computed now</b><span class="ai-chip">✦ AI-1</span></div>
      <p class="small mb3"><b>${dg.reports_this_week} reports in the last 7 days · ${dg.needs_attention} need attention.</b></p>
      <ul class="small" style="line-height:1.9">
        ${an.over_hours.map(x=>`<li><b>Over hours:</b> ${esc(x)}</li>`).join('')}
        ${an.stalls.map(x=>`<li><b>Stalled:</b> ${esc(x)}</li>`).join('')}
        ${an.blocked.map(x=>`<li><b>Blocked:</b> ${esc(x)}</li>`).join('')}
        ${clean?'<li class="mut3">No anomalies detected in this window.</li>':''}
      </ul>
      ${(dg.positive||[]).length?`<div class="note"><b>Positive:</b> ${dg.positive.map(esc).join(' · ')}</div>`:''}
      <div class="f gap2 mt3"><button class="btn sm primary" data-go="#/media/reports">Open reports</button></div>
    </div>`;
  const dups=A.dups.candidates||[];
  const dupBox=`<div class="ai-box"><div class="between mb3"><b>Duplicate detection</b><span class="ai-chip">✦ AI-3</span></div>
      ${dups.length?dups.map(c=>`<div class="note warn mb2"><b>${esc(c.a.name)}</b> ~ <b>${esc(c.b.name)}</b>
        <br><span class="small">similarity ${c.score} · ${c.reasons.join(', ')}</span></div>`).join(''):
        `<div class="hint">No likely duplicates above the ${A.dups.threshold} threshold.</div>`}</div>`;
  const sf=A.fc.shortfalls||[];
  const fcBox=`<div class="ai-box"><div class="between mb3"><b>Equipment demand forecast</b><span class="ai-chip">✦ AI-7</span></div>
      ${sf.length?sf.map(s=>`<div class="note mb2"><b>${esc(s.category)}</b>: ${s.upcoming_bookings} upcoming bookings vs
        ${s.items} in inventory — short by ~${s.short_by}.</div>`).join(''):
        `<div class="hint">Inventory covers all upcoming bookings.</div>`}
      <div class="small mut mt2">Next shoots: ${(A.fc.upcoming_shoots||[]).map(s=>esc(s.title)+' ('+s.shoot_date+')').join(' · ')||'none scheduled'}</div></div>`;

  return head+digestBox+`<div class="grid g2 mb5">${dupBox}${fcBox}</div>`+register;
}
