            daily_reports:'UNIQUE(user_id, report_date) ← BR-3 as a constraint, not a convention',
            report_tasks:'Never serialised into a blob (FR-2.4)',
            deliverable_versions:'Immutable; UNIQUE(deliverable_id, version_no)',
            equipment_bookings:'EXCLUDE USING gist — the DB itself prevents double-booking (AC-7)',
            equipment_transactions:'Immutable ledger; holder = latest transaction',
            audit_logs:'Append-only, monthly partitions, never hard-deleted',
            projects:'type_meta JSONB + GIN index; partial index on end_date for deadline scans',
            drive_links:'Polymorphic (entity_type, entity_id) with composite index',
            team_members:'Partial unique on (user_id) WHERE is_primary',
            project_assignments:'Partial unique on (project_id) WHERE is_project_manager → BR-2',
            performance_snapshots:'Immutable monthly rollup; UNIQUE(user_id, month)',
            deliverables:'Partial index on due_date — the overdue engine’s hot path'}[t];
          return `<tr><td class="mono small">${t}</td><td class="num">${(DB[t]||[]).length}</td>
            <td class="xsmall mut">${notes?esc(notes):''}</td></tr>`;}).join('')}
      </tbody></table></div></div></div>`).join('')}</div>
  <div class="card"><div class="card-head"><h3>§12 ER diagram (textual)</h3></div>
    <div class="card-body"><pre class="mono" style="font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;margin:0">${esc(ER)}</pre></div>
    <div class="card-foot">Schema is 3NF throughout. The only deliberate denormalisations are trigger-maintained aggregates
      (<span class="mono">daily_reports.total_minutes</span>, <span class="mono">equipment_items.status</span>) and monthly
      snapshots — each justified by read-path frequency and each rebuildable from source tables (§11.8).</div></div>`;
}

function specAPI(){

    ['Deliverables','GET/POST /projects/:id/deliverables · PATCH /deliverables/:id · POST /deliverables/:id/versions · POST /versions/:id/review · POST /deliverables/:id/deliver','Review endpoint enforces reviewer permission and the state machine'],
    ['Reports','GET /reports?user=&date= · GET/POST /reports/:date/tasks · PATCH/DELETE /tasks/:id · POST /reports/:date/submit · POST /reports/:id/review · POST /reports/:id/unlock','Task POST auto-creates the draft report for that date'],
    ['Equipment','GET /equipment · POST /equipment · PATCH /equipment/:id · GET/POST /equipment/:id/bookings · POST /equipment/transactions · GET /equipment/availability?from=&to= · POST /equipment/:id/damage','Transactions endpoint is the only writer of holder state'],
    ['Library / Search','GET /search?q=&filters… · GET /library/export','One search endpoint powers global search, ⌘K and the library'],
    ['Team','GET /team · GET /team/:id/profile|workload|snapshots · PATCH /users/:id · POST /users/:id/duties',''],

    ['Boards','GET/POST /boards · CRUD /boards/:id/columns · CRUD /cards · POST /cards/:id/move','Move handles column and sort atomically'],
    ['Analytics','GET /analytics/{productivity|utilization|projects|deliverables|equipment|leave}?range=&groupBy= · POST /exports','Heavy exports run async → download URL'],
    ['Platform','GET/POST /notifications · POST /notifications/read · GET/PATCH /admin/lookups/:type · GET/PATCH /admin/automations · GET /admin/audit · GET /calendar?layers=&from=&to= · GET /calendar/feed.ics?token=','One generic lookups endpoint for all Admin-managed lists']
  ];
  return `<div class="note mb4"><b>REST, JSON, versioned</b> at <span class="mono">/api/v1/media/…</span> — chosen over GraphQL
    because the client surface is one first-party app and the team is small. Cursor pagination (50 default, 200 max),
    sparse fieldsets, PATCH for partial updates, idempotency keys on POST for offline sync, RFC-7807 problem+json errors,
    ISO-8601 UTC timestamps, 100 req/min/user (burst 300 for sync).</div>
  <div class="card mb4"><div class="card-head"><h3>Endpoint map</h3></div>

        <td class="small">${esc(e[2])}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h3>Auth</h3></div><div class="card-body small">
      <p>Nerve SSO session → short-lived JWT (15 min) + refresh. The JWT carries <span class="mono">user_id, role,

      <p>Kiosk devices get a device token scoped to equipment endpoints only — rotatable and revocable per device.</p></div></div>
    <div class="card"><div class="card-head"><h3>Internal event bus</h3></div><div class="card-body small">

      <p><b>This decoupling is what keeps automations configurable without touching core code.</b></p></div></div>
  </div>`;

function openTaskLog(taskId){
  const existing=taskId?DB.report_tasks.find(t=>t.id===taskId):null;
  const pool=userProjects(S.me);
  const recent=[...new Set(DB.report_tasks.filter(t=>{const r=DB.daily_reports.find(x=>x.id===t.daily_report_id);
    return r&&r.user_id===S.me;}).slice(-30).map(t=>t.project_id))].slice(0,4);
  const todayShoot=DB.shoots.find(s=>s.shoot_date===TODAY&&DB.shoot_crew.some(c=>c.shoot_id===s.id&&c.user_id===S.me));
  const defProject=existing?existing.project_id:(todayShoot?todayShoot.project_id:(recent[0]||pool[0]&&pool[0].id));
  const lastEnd=(()=>{const r=DB.daily_reports.find(x=>x.user_id===S.me&&x.report_date===TODAY);
    if(!r)return '09:00';const ts=DB.report_tasks.filter(t=>t.daily_report_id===r.id);
    return ts.length?ts.map(t=>t.end_time).sort().pop():'09:00';})();
  modal(`<div class="mo-head"><div><h2>${existing?'Edit task log':'Log a task'}</h2>
      <p>Target: under 60 seconds, 8 interactions ${reqid('AC-1','Task log ≤ 60s and appears in the draft report within 5s')}.
      ${todayShoot?`Project pre-filled from today’s shoot — <b>${esc(todayShoot.title)}</b>.`:''}</p></div>
      <button class="icon-btn ml-auto" onclick="closeModal()">✕</button></div>
    <div class="mo-body">
      <div class="field"><label class="lbl">Project <span class="req">*</span></label>
        ${recent.length?`<div class="f wrap gap2 mb2">${recent.map(pid=>`<button class="chip ${pid===defProject?'sel':''}"
          onclick="document.getElementById('tl-project').value='${pid}';document.querySelectorAll('.chip.rec').forEach(c=>c.classList.remove('sel'));this.classList.add('sel')"
          >${esc(proj(pid).name.slice(0,26))}</button>`).join('')}</div>`:''}
        <select class="inp" id="tl-project">${pool.map(p=>`<option value="${p.id}" ${p.id===defProject?'selected':''}>${esc(p.name)} — ${p.code}</option>`).join('')}</select>
        <div class="hint">Project category derives from the project — it is never re-entered (FR-2.2).</div></div>

      <div class="field"><label class="lbl">Task category <span class="req">*</span></label>
        <div class="f wrap gap2" id="tl-cats">${DB.task_categories.filter(c=>c.is_active).map((c,i)=>
          `<button class="chip ${(existing?existing.task_category_id===c.id:i===0)?'sel':''}" data-cat="${c.id}"
            onclick="document.querySelectorAll('#tl-cats .chip').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')">
            ${c.icon} ${esc(c.name)}</button>`).join('')}</div></div>

      <div class="field"><label class="lbl">Description <span class="req">*</span></label>
        <input class="inp" id="tl-desc" placeholder="What did you do?" value="${esc(existing?existing.description:'')}">
        <div class="hint">🎙 Voice input supported on mobile. <span class="ai-chip">✦ AI-2</span> suggests a stub from your history.</div></div>

      <div class="row">
        <div class="field"><label class="lbl">Start <span class="req">*</span></label>
          <input class="inp" type="time" id="tl-start" value="${existing?existing.start_time:lastEnd}"></div>
        <div class="field"><label class="lbl">End <span class="req">*</span></label>
          <input class="inp" type="time" id="tl-end" value="${existing?existing.end_time:m2t(t2m(lastEnd)+120)}"></div>
      </div>
      <div id="tl-timeerr"></div>

      <div class="row">
        <div class="field"><label class="lbl">Quantity</label>
          <input class="inp" type="number" id="tl-qty" placeholder="e.g. 1800" value="${existing&&existing.quantity?existing.quantity:''}"></div>
        <div class="field"><label class="lbl">Unit</label>
          <input class="inp" id="tl-unit" placeholder="photos / videos / reels" value="${esc(existing&&existing.unit?existing.unit:'')}"></div>
      </div>

      <div class="field"><label class="lbl">Linked deliverable <span class="mut3">(optional)</span></label>
        <select class="inp" id="tl-deliv"><option value="">— none —</option>
          ${DB.deliverables.filter(d=>d.project_id===defProject).map(d=>
            `<option value="${d.id}" ${existing&&existing.deliverable_id===d.id?'selected':''}>${esc(d.title)}</option>`).join('')}</select>
        <div class="hint">Filtered to the chosen project. Claiming completion without evidence auto-flags the report (AUTO-13 / AC-3).</div></div>

      <div class="field"><label class="lbl">Evidence</label>
        <input class="inp" id="tl-link" placeholder="https://drive.google.com/…">
        <div class="hint">Must match drive.google.com or docs.google.com; params are stripped and duplicates rejected (VR-4).
          Attachments ≤ 25 MB, virus-scanned (VR-5).</div></div>

      <div class="field"><label class="lbl">Status</label>
        <div class="seg" id="tl-status">${['done','in_progress','blocked'].map((s,i)=>
          `<button class="${(existing?existing.status===s:i===0)?'on':''}" data-st="${s}"
            onclick="document.querySelectorAll('#tl-status button').forEach(x=>x.classList.remove('on'));this.classList.add('on');
                     document.getElementById('tl-blocker').style.display=this.dataset.st==='blocked'?'block':'none'">
            ${({done:'✔ Done',in_progress:'▶ In progress',blocked:'‖ Blocked'})[s]}</button>`).join('')}</div>
        <div id="tl-blocker" style="display:${existing&&existing.status==='blocked'?'block':'none'};margin-top:8px">
          <input class="inp" id="tl-blocknote" placeholder="What is blocking this? (required — FR-2.8)" value="${esc(existing?existing.blocker_note:'')}"></div></div>

      <details><summary class="small mut" style="cursor:pointer">Optional progress before / after (D3 — secondary signal)</summary>
        <div class="row mt3">
          <div class="field"><label class="lbl">Progress before</label><input class="inp" type="number" min="0" max="100" id="tl-pb"
            value="${existing&&existing.progress_before!=null?existing.progress_before:''}"></div>
          <div class="field"><label class="lbl">Progress after</label><input class="inp" type="number" min="0" max="100" id="tl-pa"
            value="${existing&&existing.progress_after!=null?existing.progress_after:''}"></div>
        </div>
        <div class="hint">Project progress is computed from deliverable state, not from these numbers.</div></details>
    </div>
    <div class="mo-foot">
      ${existing?`<button class="btn ghost left" data-act="deleteTask" data-tid="${existing.id}">Delete</button>`:
        `<span class="left small mut3">Saves to today’s draft report</span>`}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" data-act="saveTask" data-tid="${existing?existing.id:''}">${existing?'Save':'Log task'}</button></div>`,{size:'wide'});
  $('#modal-layer').querySelectorAll('[data-act]').forEach(n=>n.onclick=e=>{e.stopPropagation();ACTIONS[n.dataset.act](n.dataset,n);});
  const val=()=>{
    const s=t2m($('#tl-start').value),e=t2m($('#tl-end').value);
    const box=$('#tl-timeerr');box.innerHTML='';
    if(e<=s){box.innerHTML='<div class="err-msg">⚠ End must be after start (VR-1).</div>';return;}
    const r=DB.daily_reports.find(x=>x.user_id===S.me&&x.report_date===TODAY);
    const tot=(r?DB.report_tasks.filter(t=>t.daily_report_id===r.id&&t.id!==(existing&&existing.id)).reduce((a,t)=>a+t.minutes,0):0)+(e-s);
    if(tot>16*60)box.innerHTML='<div class="err-msg">⚠ Total would exceed 16h — confirmation required and the report is auto-flagged (VR-1 / AUTO-13).</div>';
    else if(r&&DB.report_tasks.some(t=>t.daily_report_id===r.id&&t.id!==(existing&&existing.id)&&t2m(t.start_time)<e&&t2m(t.end_time)>s))
      box.innerHTML='<div class="warn-msg">ⓘ Overlaps another task today. Allowed — parallel work like “rendering while shooting” is real (VR-1).</div>';
    else box.innerHTML=`<div class="hint">Duration ${mins2h(e-s)} · day total ${mins2h(tot)}</div>`;
  };
  $('#tl-start').oninput=val;$('#tl-end').oninput=val;val();
  $('#tl-project').onchange=()=>{const pid=+$('#tl-project').value;
    $('#tl-deliv').innerHTML='<option value="">— none —</option>'+DB.deliverables.filter(d=>d.project_id===pid)
      .map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('');};
}

function evaluateFlags(r,ts){
  const cfg=DB.automation_rules.find(x=>x.rule_key==='AUTO-13').config;
  const out=[];const total=ts.reduce((s,t)=>s+t.minutes,0);
  if(total>cfg.max_hours*60)out.push('Total logged hours above '+cfg.max_hours+'h');
  if(total<cfg.min_hours*60)out.push('Total logged hours below '+cfg.min_hours+'h on a working day');
  if(ts.some(t=>t.deliverable_id&&t.status==='done'&&(!t.evidence||!t.evidence.length)))
    out.push('Deliverable-completion claim without an evidence link');
  const descs=ts.map(t=>t.description);
  if(descs.length>=cfg.identical_streak&&new Set(descs).size===1)out.push(cfg.identical_streak+'+ identical task descriptions');
  let miss=0;for(let i=1;i<=6;i++){const day=D.add(r.report_date,-i);
    if(!expectsReport(r.user_id,day))continue;
    if(!DB.daily_reports.some(x=>x.user_id===r.user_id&&x.report_date===day))miss++;else break;}
  if(miss>=cfg.missing_days)out.push('First report after '+miss+' missing days');
  return out;
}

  /* ---- projects ---- */
  dupCheck:(d,n)=>{
    const q=n.value.toLowerCase().trim();const box=$('#np-dup');
    if(q.length<3){box.innerHTML='';return;}
    const hits=DB.projects.filter(p=>{
      const a=new Set(p.name.toLowerCase().split(/\s+/)),b=new Set(q.split(/\s+/));
      const inter=[...b].filter(x=>a.has(x)).length;
      return inter/Math.max(1,b.size)>0.5;});
    box.innerHTML=hits.length?`<div class="warn-msg">⚠ AUTO-6 — possible duplicate:
      ${hits.slice(0,2).map(p=>`<a href="#/media/projects/${p.id}" onclick="closeModal()">${esc(p.name)}</a> (${esc(ayear(p.academic_year_id))})`).join(', ')}.
      Exact name + same year + same type would block; this is a warning (VR-6).</div>`:'';
  },

  createProject:()=>{
    const name=$('#np-name').value.trim();
    if(name.length<3||name.length>120){toast('VR-6: name must be 3–120 characters','bad');return;}
    const start=$('#np-start').value,end=$('#np-end').value;
    if(end<start){toast('VR-6: end date must be on or after the start date','bad');return;}
    const tid=+$('#np-type').value;
    const id=Math.max(...DB.projects.map(p=>p.id))+1;
    const gated=!can('project.approve');
    const p={id,department_id:1,campus_id:1,academic_year_id:+$('#np-year').value,project_type_id:tid,
      code:'MC-2627-'+String(100+id),name,description:$('#np-desc').value.trim(),
      faculty_served:$('#np-fac').value,status:gated?'proposed':'planning',priority:$('#np-pri').value,
      owner_id:S.me,created_by:S.me,start_date:start,end_date:end,cover_image_url:null,type_meta:{},
      source:'app',archived_at:null,deleted_at:null,tags:[]};
    DB.projects.push(p);
    DB.project_assignments.push({id:Math.max(...DB.project_assignments.map(a=>a.id))+1,project_id:id,user_id:S.me,
      capacity_role_id:5,is_project_manager:true,assigned_by:S.me,assigned_at:TODAY,removed_at:null});
    const t=DB.project_templates.find(x=>x.project_type_id===tid);
    let made=0;
    if(t){DB.template_deliverables.filter(x=>x.template_id===t.id).forEach(td=>{
      const dt=dtype(td.deliverable_type_id);
      DB.deliverables.push({id:Math.max(...DB.deliverables.map(x=>x.id))+1,project_id:id,
        deliverable_type_id:td.deliverable_type_id,title:td.title_pattern.replace('{project}',name),
        owner_id:S.me,due_date:D.add(end,td.days_offset_due),completed_at:null,quantity_target:null,
        quantity_delivered:null,unit:dt.default_unit,spec_notes:'',weight:td.default_weight,status:'not_started',
        social_status:'na',social_post_url:null,social_posted_at:null,mail_status:'na',mail_sent_at:null,deleted_at:null});
      made++;});}
    audit(S.me,'project.created','project',id,null,{name,status:p.status,deliverables_created:made});
    const _np={name,project_type_id:tid,priority:$('#np-pri').value,faculty_served:$('#np-fac').value,
      start_date:start,end_date:end,description:$('#np-desc').value.trim(),academic_year_id:+$('#np-year').value,
      apply_template:true, template_items:$$('#np-template .np-tmpl-item:checked').map(c=>+c.value),
      assignees:$$('#np-assign .chip.sel').map(c=>ruid(+c.dataset.uid))};
    closeModal();location.hash='#/media/projects/'+id;render();
    moSync(MO_API.post('/projects',_np), res=>{ if(res&&res.project) location.hash='#/media/projects/'+res.project.id; });
    toast(gated?'Proposed — pending approval before it is reportable-against (BR-11)':
      'Created with '+made+' deliverables from the template (FR-3.2)','ok');
  },

  approveVersion:(d)=>{

    const v=DB.deliverable_versions.filter(x=>x.deliverable_id===dl.id).sort((a,b)=>b.version_no-a.version_no)[0];
    if(v.submitted_by===S.me){toast('BR-5: a version cannot be approved by its submitter','bad');return;}
    if(!(isAdmin()||isTL()||isPMof(dl.project_id))){toast('403 — reviewer must be the PM, a TL or Admin (BR-5)','bad');return;}
    v.review_status='approved';v.reviewed_by=S.me;v.reviewed_at=TODAY;
    dl.status='approved';
    audit(S.me,'deliverable.version_reviewed','deliverable_version',v.id,{review_status:'pending'},{review_status:'approved'});
    drawerDeliverable(dl.id);render();toast('v'+v.version_no+' approved','ok');
    moSync(MO_API.post('/deliverables/'+dl.id+'/review',{outcome:'approved'}), ()=>drawerDeliverable(dl.id));
  },

  markDelivered:(d)=>{
    const dl=deliv(+d.did);const t=dtype(dl.deliverable_type_id);
    const vs=DB.deliverable_versions.filter(v=>v.deliverable_id===dl.id);

  doExport:(d)=>{
    const w=d.what||'projects';
    const sets={
      projects:()=>['projects',filteredProjects().map(p=>({code:p.code,name:p.name,type:ptype(p.project_type_id).name,status:p.status,priority:p.priority,owner:user(p.owner_id).full_name,start:p.start_date,end:p.end_date}))],

      library:()=>['library',DB.deliverables.map(x=>({title:x.title,project:proj(x.project_id).name,status:x.status,due:x.due_date}))],
      audit:()=>['audit',DB.audit_logs.map(a=>({when:a.at||a.created_at||'',actor:user(a.actor_id).full_name,action:a.action,entity:(a.entity_type||'')+' #'+(a.entity_id||'')}))],
      performance:()=>['performance',DB.performance_snapshots.map(s=>({user:user(s.user_id).full_name,month:s.month,hours:s.hours_logged,tasks:s.tasks_count,deliverables:s.deliverables_completed,on_time:s.on_time_pct,consistency:s.consistency_pct}))],
      analytics:()=>['team',DB.users.filter(u=>u.is_active).map(u=>({name:u.full_name,role:u.role,projects:activeProjectsOf(u.id).length,open_deliverables:openDeliverables(u.id).length,consistency:consistency(u.id)}))],
      pack:()=>['projects',filteredProjects().map(p=>({code:p.code,name:p.name,status:p.status,owner:user(p.owner_id).full_name}))]
    };
    const [name,rows]=(sets[w]||sets.projects)();
    if(!rows.length){toast('Nothing to export in this view','warn');return;}
    const cols=Object.keys(rows[0]);
    const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))].join('\n');
    const a=document.createElement('a'); const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.href=url; a.download='media-ops-'+name+'-'+TODAY+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    audit(S.me,'export.generated','export',0,null,{report:w,rows:rows.length});
    closeModal(); toast('Exported '+rows.length+' rows — media-ops-'+name+'-'+TODAY+'.csv','ok');
  },

function applyDelivStatus(dl,s){
  const t=dtype(dl.deliverable_type_id);
  const vs=DB.deliverable_versions.filter(v=>v.deliverable_id===dl.id).sort((a,b)=>b.version_no-a.version_no);
  const latest=vs[0];
  if(!isAdmin()){  /* Admin has full override — no review mandate (#4) */
    if(s==='approved'&&latest&&latest.submitted_by===S.me){
      toast('BR-5: you submitted the latest version — someone else must approve it','bad');return false;}
    if(s==='approved'&&!(isTL()||isPMof(dl.project_id))){
      toast('BR-5: reviewer must be the project PM, a Team Lead or Admin','bad');return false;}
    if(s==='delivered'&&!t.review_exempt&&(!latest||latest.review_status!=='approved')){
      toast('BR-6: Delivered requires an approved latest version','bad');return false;}
  }
  const before=dl.status;dl.status=s;
  if(s==='delivered')dl.completed_at=TODAY;
  audit(S.me,'deliverable.status_changed','deliverable',dl.id,{status:before},{status:s});
  render();toast('Status → '+DELIV_STATUS[s].l,'ok');
  moSync(MO_API.post('/deliverables/'+dl.id+'/status',{status:s}));
  return true;
}

/* ==========================================================================
   DRAG & DROP (optimistic, permission-checked, audited)
   ========================================================================== */
function wireDnD(){
  $$('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{S.dragging=el.dataset.drag;el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.drag);}catch(_){}});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');S.dragging=null;
      $$('.kb-col').forEach(c=>c.classList.remove('over'));});
  });
  $$('[data-drop]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('over');
      const src=S.dragging;if(!src)return;
      const [skind,sid]=src.split(':'), [dkind,did]=col.dataset.drop.split(':');
      if(skind==='project'&&dkind==='projstatus'){
        const p=proj(+sid);
        if(!can('project.status',{project_id:p.id})){toast('403 — you cannot change this project’s status (§16)','bad');return;}
        if(!(PROJ_TRANSITIONS[p.status]||[]).includes(did)){
          toast('BR-1: '+PROJ_STATUS[p.status].l+' → '+PROJ_STATUS[did].l+' is not a valid transition','bad');return;}
        const before=p.status;p.status=did;
        audit(S.me,'project.status_changed','project',p.id,{status:before},{status:did});
        render();toast(p.name+' → '+PROJ_STATUS[did].l,'ok');
        moSync(MO_API.post('/projects/'+p.id+'/status',{status:did}));
      }
      else if(skind==='deliverable'&&dkind==='delivstatus'){
        const dl=deliv(+sid);
        if(!(DELIV_TRANSITIONS[dl.status]||[]).includes(did)){
          toast('Not a valid transition: '+DELIV_STATUS[dl.status].l+' → '+DELIV_STATUS[did].l,'bad');return;}
        applyDelivStatus(dl,did);
      }
      else if(skind==='card'&&dkind==='cardcol'){
        const c=DB.cards.find(x=>x.id===+sid);
        const col2=DB.board_columns.find(x=>x.id===+did);
        c.column_id=+did;
        const b=DB.boards.find(x=>x.id===c.board_id);
        let synced='';
        if(b.sync_status&&col2.maps_to_status&&c.linked_entity_type==='deliverable'){
          const dl=deliv(c.linked_entity_id);
          if(dl){dl.status=col2.maps_to_status;synced=' · linked deliverable synced to '+DELIV_STATUS[col2.maps_to_status].l;}
        }
        audit(S.me,'card.moved','card',c.id,null,{column:col2.name});
        render();toast('Moved to '+col2.name+synced,'ok');
        moSync(MO_API.patch('/cards/'+c.id,{column_id:+did}));
      }
    });
  });
}

   BOOT
   ========================================================================== */
/* ── Backend wiring (Phase 1 · Part B): hydrate DB from /api/v1/media/state ──
   Overlays the live server dataset onto the in-memory seed. GUARDED: a failed
   fetch (e.g. no session, backend down) silently keeps the seed so the UI always
   runs. The server emits rows in the seed's exact shape — integer user-ids and
   string dates — so views render unchanged, now backed by Postgres. */
const MO_API = {
  base:'/api/v1/media',
  async req(m,p,body){
    const r=await fetch(this.base+p,{method:m,credentials:'same-origin',
      headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:body!==undefined?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.message||('HTTP '+r.status));
    return j;
  },
  get(p){return this.req('GET',p);}, post(p,b){return this.req('POST',p,b);},
  patch(p,b){return this.req('PATCH',p,b);}, del(p){return this.req('DELETE',p);}
};
/* Upload an image file → returns its URL (add-member + profile photos). */
async function uploadImage(file){
  const fd=new FormData(); fd.append('image',file);
  const r=await fetch('/api/v1/media/upload-image',{method:'POST',credentials:'same-origin',body:fd});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.message||('HTTP '+r.status));
  return j.url;
}
/* Build real notifications for the current user from live data (the click-through /
   redirect in ACTIONS.openNotif already works). Runs after each hydrate. */
function genNotifications(){
  DB.notifications=[];
  const add=(kind,title,body,et,eid)=>notify(S.me,kind,title,body,et,eid,0);
  DB.deliverables.filter(d=>d.owner_id===S.me&&d.due_date&&d.due_date<TODAY&&!['delivered','not_required','cancelled'].includes(d.status))
    .slice(0,12).forEach(d=>add('overdue','Deliverable overdue','“'+d.title+'” was due '+D.fmt(d.due_date),'deliverable',d.id));
  DB.deliverables.filter(d=>d.status==='in_review'&&(isAdmin()||isTL()||isPMof(d.project_id)))
    .slice(0,12).forEach(d=>add('approval','Awaiting your review','“'+d.title+'” has a version pending','deliverable',d.id));
  if(!isEmp())DB.daily_reports.filter(r=>r.status==='flagged').slice(0,12)
    .forEach(r=>add('automation','Report flagged for review',user(r.user_id).full_name+' · '+r.report_date,'report',r.id));
  DB.project_assignments.filter(a=>a.user_id===S.me&&!a.removed_at&&!a.is_project_manager).slice(0,6)
    .forEach(a=>{const p=proj(a.project_id);if(p&&p.id)add('review','Assigned to a project','You were assigned to “'+p.name+'”','project',p.id);});
}
async function hydrateFromServer(){
  const keys=['projects','project_assignments','deliverables','deliverable_versions','drive_links','daily_reports','report_tasks',
    'vendors','equipment_categories','equipment_items','equipment_kits','kit_items','equipment_bookings','equipment_transactions',
    'maintenance_records','shoots','shoot_crew','leave_types','leave_requests','leave_replacements','holidays',
    'labels','boards','board_columns','cards','kra_cycles','kras','kra_reviews','performance_snapshots','comments','saved_views',
    'automation_rules','teams','team_members','duty_flags','user_duties','skills','user_skills','notifications','users'];
  const st=await MO_API.get('/state');
  keys.forEach(k=>{ if(Array.isArray(st[k])) DB[k]=st[k]; });
  // Bind identity to the real logged-in Nerve user (server sends its prototype int id).
  if(typeof st.me==='number' && DB.users.some(u=>u.id===st.me)) S.me=st.me;
  // Clear the prototype's seed activity + notifications so nothing dummy shows on live;
  // audit() re-populates the activity feed from this session's real actions.
  // Notifications are now server-persisted (written by the automation engine) and
  // arrive via /state; only synthesize client-side if the server didn't send any.
  DB.audit_logs=[]; DB.activity=[];
  if(!Array.isArray(st.notifications)) genNotifications();
  window.__MO_LIVE__=true;
  return {projects:(st.projects||[]).length, reports:(st.daily_reports||[]).length};
}
/* Optimistic write-through: the action has already mutated DB locally and
   re-rendered; here we persist to the server (which re-enforces the business
   rules) then re-hydrate to the authoritative state — picking up server-assigned
   ids, project codes, template deliverables and flag results. On rejection we
   surface the server's reason and revert by re-hydrating. In seed mode (no
   session/backend) this is a no-op, so the prototype behaves exactly as before. */
async function moSync(promise, onOk){
  if(!window.__MO_LIVE__) return;
  try{
    const res=await promise;
    await hydrateFromServer();
    if(onOk) onOk(res);
    render();
  }catch(e){
    toast('Server rejected this change: '+e.message+' — reverting.','bad');
    try{ await hydrateFromServer(); render(); }catch(_){/* stay on optimistic state */}
  }
}
/* PWA service worker (Phase 4). The app is served under /api/media-ops/, so the SW
   scope is its own directory. First unregister any stale worker from the earlier
   /media-ops/ static path so it can't serve a cached shell. Guarded throughout. */
if('serviceWorker' in navigator){ try{
  navigator.serviceWorker.getRegistrations().then(rs=>{
    rs.filter(r=>!(r.scope||'').includes('/api/media-ops/')).forEach(r=>r.unregister());
  }).catch(()=>{});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}catch(_){} }
(async function boot(){
  if(!location.hash)location.hash='#/media/home';
  let live=null;
  // Identity is bound inside hydrateFromServer() from /state's `me` (the real crew,
  // not the demo seed). If hydration fails (no session/standalone), the seed identity
  // is used as a fallback so the app still runs.
  try{ live=await hydrateFromServer(); }
  catch(e){ console.warn('[Media Ops] server hydration failed — running on seed data:', e.message); }
  render();
  /* Live counters refresh — FR-1.1 requires ≤ 60 s */
  setInterval(()=>{if(S.route==='#/media/home'&&!$('#modal-layer').classList.contains('on')&&
    !$('#drawer').classList.contains('on')&&!$('#palette').classList.contains('on')){/* silent no-op re-render guard */}},60000);
  setTimeout(()=>{
    toast(live
      ? `Live · ${live.projects} projects and ${live.reports} daily reports from the server. Signed in as ${me().full_name}.`
      : 'Running on seed data — sign in to Nerve to load live data.', live?'ok':'warn');
  },700);
})();
